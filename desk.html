<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
/* One site, two layouts. Phones get the desk-display board (index.html); bigger screens
   (laptops, desktops, iPads) get the desktop board (desk.html). Same data, same sign-in.
   Add ?view=board or ?view=desk to the address to pin one on this device; ?view=auto undoes it. */
(function () {
  var pin = "";
  try {
    var q = new URLSearchParams(location.search).get("view");
    if (q) localStorage.setItem("deskboard-layout", q === "auto" ? "" : q);
    pin = localStorage.getItem("deskboard-layout") || "";
  } catch (e) {}
  var phone = Math.min(screen.width, screen.height) < 600;
  var want = pin === "board" || pin === "desk" ? pin : (phone ? "board" : "desk");
  var here = /desk\.html$/i.test(location.pathname) ? "desk" : "board";
  if (want !== here) location.replace((want === "desk" ? "desk.html" : "index.html") + location.hash);
})();
</script>
<title>Desk Board · Desktop</title>
<link rel="icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jersey+10&family=Silkscreen&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --page: #efebe1;
  --page-2: #e6e1d4;
  --card: #fbf9f4;
  --card-2: #f4f1e8;
  --line: #ddd7c8;
  --ink: #15301b;
  --ink-2: #4a5d4c;
  --ink-3: #7d8a7c;
  --sage: #86a98c;
  --sage-deep: #5f8a67;
  --mint: #cfe6c8;
  --lcd: #bfdcb8;
  --alert: #b4532a;
  --alert-bg: #f6e1d6;
  --warn: #a8761c;
  --warn-bg: #f4ead2;
  --ok: #3f7d4c;
  --shadow: 0 1px 0 rgba(21, 48, 27, 0.04), 0 6px 18px rgba(21, 48, 27, 0.06);
  --shadow-lift: 0 2px 0 rgba(21, 48, 27, 0.05), 0 18px 40px rgba(21, 48, 27, 0.16);
  --f-ui: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num: "Jersey 10", ui-monospace, monospace;
  --f-label: "Silkscreen", ui-monospace, monospace;
  --radius: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #111713; --page-2: #161e18; --card: #1a231c; --card-2: #212b23; --line: #2e3a30;
    --ink: #e4eedf; --ink-2: #b4c4b0; --ink-3: #85947f; --sage: #86a98c; --sage-deep: #9cc4a3; --mint: #23352a; --lcd: #2c4433;
    --alert: #f08d62; --alert-bg: #3a2219; --warn: #e2b55a; --warn-bg: #352b16; --ok: #8fd18a;
    --shadow: 0 1px 0 rgba(0, 0, 0, 0.3), 0 6px 18px rgba(0, 0, 0, 0.25); --shadow-lift: 0 18px 40px rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #111713; --page-2: #161e18; --card: #1a231c; --card-2: #212b23; --line: #2e3a30;
  --ink: #e4eedf; --ink-2: #b4c4b0; --ink-3: #85947f; --sage: #86a98c; --sage-deep: #9cc4a3; --mint: #23352a; --lcd: #2c4433;
  --alert: #f08d62; --alert-bg: #3a2219; --warn: #e2b55a; --warn-bg: #352b16; --ok: #8fd18a;
  --shadow: 0 1px 0 rgba(0, 0, 0, 0.3), 0 6px 18px rgba(0, 0, 0, 0.25); --shadow-lift: 0 18px 40px rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--page); color: var(--ink); font: 400 15px/1.45 var(--f-ui); -webkit-font-smoothing: antialiased; min-height: 100vh; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--sage-deep); outline-offset: 2px; }
.label { font: 400 10px/1.2 var(--f-label); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }

/* ---------- Top bar ---------- */
.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 20px; padding: 10px 24px; height: 60px; background: color-mix(in srgb, var(--page) 90%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.brand { width: 232px; flex: none; font: 400 12px/1 var(--f-label); letter-spacing: 0.12em; color: var(--ink-2); white-space: nowrap; display: flex; align-items: center; gap: 10px; }
.brand i { width: 22px; height: 22px; border-radius: 6px; background: var(--lcd); box-shadow: inset 0 0 0 2px var(--sage-deep); }
.today { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
.today .date { font-weight: 600; font-size: 1rem; white-space: nowrap; color: var(--ink-2); }
.today .clock { font: 400 28px/1 var(--f-num); letter-spacing: 0.02em; }
.spacer { flex: 1; }
.timer { display: flex; align-items: center; gap: 10px; padding: 4px 4px 4px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; }
.timer .t { font: 400 24px/1 var(--f-num); min-width: 3.1ch; text-align: right; }
.timer .phase { font: 400 9px/1.2 var(--f-label); letter-spacing: 0.08em; color: var(--ink-3); text-transform: uppercase; white-space: nowrap; }
.timer .pomos { display: flex; gap: 3px; min-height: 7px; }
.timer .pomos { font-size: 0.72rem; color: var(--ink-2); font-weight: 600; white-space: nowrap; }
.timer .mode-btn { border: 0; background: transparent; color: var(--ink-3); font-size: 0.72rem; font-weight: 600; padding: 4px 6px; border-radius: 8px; white-space: nowrap; }
.timer .mode-btn:hover:not(:disabled) { background: var(--page-2); color: var(--ink); }
.timer .mode-btn:disabled { opacity: 0.5; }
.pill-btn { border: 0; border-radius: 999px; padding: 7px 14px; font-weight: 600; font-size: 0.85rem; background: var(--card-2); color: var(--ink); }
.pill-btn.primary { background: var(--ink); color: var(--card); }
.pill-btn.sage { background: var(--sage); color: #10261a; }
.pill-btn.ghost { background: transparent; border: 1px solid var(--line); }
.pill-btn:hover { filter: brightness(0.96); }
.exam-chip { font-size: 0.82rem; font-weight: 700; color: var(--alert); background: var(--alert-bg); border-radius: 999px; padding: 6px 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 320px; }
.exam-chip.soon { background: var(--alert); color: #fff; animation: examPulse 2s ease-in-out infinite; }
@keyframes examPulse { 50% { filter: brightness(1.15); } }
.sync { display: flex; align-items: center; gap: 7px; font-size: 0.8rem; color: var(--ink-3); white-space: nowrap; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); }
.sync.ok i { background: #7cc47a; box-shadow: 0 0 6px rgba(124, 196, 122, 0.8); }
.sync.bad i { background: var(--alert); }

/* ---------- Editor drawer ---------- */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(10, 20, 12, 0.28); }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; z-index: 41; width: min(460px, 100vw); background: var(--card); border-left: 1px solid var(--line); box-shadow: var(--shadow-lift); display: flex; flex-direction: column; }
.dr-head { display: flex; align-items: center; gap: 10px; padding: 16px 18px 12px; border-bottom: 1px solid var(--line); }
.dr-head h2 { margin: 0; font-size: 1.05rem; flex: 1; }
.dr-x { border: 0; background: transparent; width: 34px; height: 34px; border-radius: 50%; font-size: 20px; color: var(--ink-2); }
.dr-x:hover { background: var(--page-2); }
.dr-body { flex: 1; overflow-y: auto; padding: 14px 18px 20px; display: flex; flex-direction: column; gap: 16px; }
.dr-foot { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 18px 16px; border-top: 1px solid var(--line); }
.dr-foot .grow { flex: 1; }
.fld { display: flex; flex-direction: column; gap: 6px; }
.fld > .label { font-size: 10px; }
.inp { width: 100%; font: inherit; color: var(--ink); background: var(--card-2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; }
.inp:focus { outline: 2px solid var(--sage-deep); outline-offset: 0; background: var(--card); }
.inp.big { font-size: 1.1rem; font-weight: 600; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row .inp { width: auto; flex: 1; min-width: 0; }
.mini { border: 1px solid var(--line); background: var(--card); color: var(--ink-2); border-radius: 999px; padding: 4px 10px; font-size: 0.8rem; font-weight: 600; }
.mini:hover { border-color: var(--sage-deep); color: var(--ink); }
.mini[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--card); }
.mini.danger { color: var(--alert); }
.mini.danger.arm { background: var(--alert); border-color: var(--alert); color: #fff; }
.hint { font-size: 0.8rem; color: var(--ink-3); margin: 0; }
.hint.err { color: var(--alert); font-weight: 600; }
.ed-steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.ed-steps li { display: flex; align-items: center; gap: 4px; }
.ed-steps input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--sage-deep); flex: none; margin-right: 4px; }
.ed-steps .inp { padding: 7px 9px; }
.grow-box { resize: none; overflow: hidden; line-height: 1.35; display: block; min-height: 0; }
.ed-steps li { align-items: flex-start; }
.ed-steps li > input[type=checkbox], .ed-steps .ico-btn { margin-top: 6px; }
.ed-steps li.digest .inp { border-style: dashed; }
.ico-btn { border: 0; background: transparent; color: var(--ink-3); width: 28px; height: 28px; border-radius: 8px; flex: none; font-size: 15px; padding: 0; }
.ico-btn:hover:not(:disabled) { background: var(--page-2); color: var(--ink); }
.ico-btn:disabled { opacity: 0.3; }
.ico-btn[aria-pressed="true"] { color: var(--sage-deep); font-weight: 700; }
.ro { display: flex; flex-direction: column; gap: 4px; font-size: 0.92rem; }
.ro b { font-size: 1.15rem; }
a.gcal { color: var(--sage-deep); font-weight: 700; font-size: 0.85rem; text-decoration: none; }
a.gcal:hover { text-decoration: underline; }
.edit-link { border: 0; background: none; padding: 0; color: var(--sage-deep); font-weight: 700; font-size: 0.8rem; cursor: pointer; margin-left: 4px; }
.edit-link:hover { text-decoration: underline; }
.now h1 .edit-link { vertical-align: middle; }
.agenda li { cursor: pointer; border-radius: 8px; }
.agenda li:hover { background: var(--card-2); }
.today-card .day-nav { display: flex; align-items: center; gap: 4px; }
.today-card .day-nav h2 { flex: 1; }
.composer .plus { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--sage-deep); color: var(--sage-deep); display: grid; place-items: center; font-weight: 700; line-height: 1; flex: none; margin-right: 4px; }
.inp.time { width: 5.2em !important; flex: 0 0 auto !important; text-align: center; font-variant-numeric: tabular-nums; }
.inp.bad { outline: 2px solid var(--alert); }

/* ---------- Full-screen focus (styles) ---------- */
html.fs-open { overflow: hidden; }
.fs { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; justify-content: space-between; gap: 16px; padding: 28px 40px 32px; background: var(--page); }
.fs-top { display: flex; justify-content: space-between; }
.fs-top .label { font-size: 12px; }
/* The clock and what you're working on sit together in the middle; the controls stay at the bottom. */
.fs-time { flex: 0 1 auto; margin-top: auto; min-height: 0; border: 0; background: none; color: var(--ink); font: 400 min(34vw, 58vh)/0.8 var(--f-num); letter-spacing: 0.02em; text-indent: 0.076em; display: grid; place-items: center; cursor: pointer; padding: 0; }
.fs.is-rest .fs-time { color: var(--sage-deep); }
.fs-what { text-align: center; max-width: 900px; margin: 3vh auto auto; min-width: 0; width: 100%; }
.fs-title { font-size: clamp(22px, 3.4vw, 36px); font-weight: 700; line-height: 1.2; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.fs-step { margin-top: 6px; font-size: clamp(16px, 2vw, 22px); line-height: 1.3; color: var(--ink-2); overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.fs-title:empty, .fs-step:empty { display: none; }
/* Three columns of equal outer width, so the tally sits exactly in the middle. */
.fs-bar { display: grid; grid-template-columns: 1fr minmax(0, max-content) 1fr; align-items: center; gap: 12px; max-width: 900px; width: 100%; margin: 0 auto; }
.fs-group { display: flex; gap: 12px; }
.fs-group.end { justify-content: flex-end; }
.fs-big { padding: 12px 20px; font-size: 1rem; white-space: nowrap; }
.fs-group .split { display: inline-flex; }
.fs-group .split .pill-btn { border-radius: 999px 0 0 999px; }
.fs-group .split .more { border-radius: 0 999px 999px 0; border-left: 0; padding: 12px 14px; min-width: 0; }
/* How much of the round is left, for when numbers don't land. */
.fs-drain { width: min(60vw, 520px); height: 6px; border-radius: 99px; background: color-mix(in srgb, currentColor 12%, transparent); margin: 2vh auto 0; overflow: hidden; }
.fs-drain i { display: block; height: 100%; background: var(--sage-deep); border-radius: 99px; transition: width 1s linear; }
.fs.is-rest .fs-drain i { background: var(--ink-3); }
/* The one button you should never have to aim for. */
.gofab { position: fixed; left: 26px; bottom: 26px; z-index: 40; display: flex; align-items: center; gap: 10px; padding: 14px 22px 14px 18px; border: 0; border-radius: 999px; background: var(--ink); color: var(--card); font: 700 1rem var(--f-ui); box-shadow: var(--shadow-lift); cursor: pointer; }
.gofab:hover { filter: brightness(1.12); }
.gofab .ico-play { width: 0; height: 0; border-style: solid; border-width: 8px 0 8px 13px; border-color: transparent transparent transparent currentColor; margin-left: 2px; }
.gofab .ico-pause { width: 12px; height: 16px; border-left: 4px solid currentColor; border-right: 4px solid currentColor; }
.gofab.on { background: var(--sage-deep); }
.gofab .go-sub { font-weight: 500; opacity: 0.75; font-size: 0.85rem; }
@media (max-width: 820px) { .gofab { left: 16px; bottom: 16px; } }
body:has(#gofab) .toasts { bottom: 92px; }
body.night .gofab { display: none; }
.fs-tally { text-align: center; color: var(--ink-3); font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.timer .t { cursor: pointer; }
.timer .expand { border: 0; background: transparent; color: var(--ink-3); width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; padding: 0; }
.timer .expand:hover { background: var(--page-2); color: var(--ink); }
@media (max-width: 640px) { .fs { padding: 18px 16px 20px; } .fs-bar { display: flex; flex-wrap: wrap; justify-content: center; } .fs-group { display: contents; } .fs-tally { flex-basis: 100%; order: -1; } }

/* ---------- Page: sidebar · list · today ---------- */
.shell { display: grid; grid-template-columns: 256px minmax(0, 1fr) 340px; grid-template-areas: "side main rail"; gap: 28px; max-width: 1640px; margin: 0 auto; padding: 22px 24px 60px; align-items: start; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.ico { width: 18px; height: 18px; flex: none; display: inline-block; }
.ico svg { width: 100%; height: 100%; display: block; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* Sidebar */
.side { grid-area: side; position: sticky; top: 82px; display: flex; flex-direction: column; gap: 2px; max-height: calc(100vh - 100px); overflow-y: auto; }
.nav-item, .course-item { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; background: transparent; text-align: left; padding: 9px 14px; border-radius: 0 999px 999px 0; margin-left: -24px; padding-left: 38px; width: calc(100% + 24px); color: var(--ink-2); font-weight: 600; font-size: 0.93rem; }
.nav-item:hover, .course-item:hover { background: var(--page-2); }
.nav-item[aria-current="true"], .course-item[aria-current="true"] { background: var(--mint); color: var(--ink); }
.nav-item .n, .course-item .n { margin-left: auto; font: 400 17px/1 var(--f-num); color: var(--ink-3); }
.nav-item[aria-current="true"] .n { color: var(--ink); }
.side-label { margin: 18px 0 6px 14px; }
.course-item { font-weight: 500; padding-top: 7px; padding-bottom: 7px; }
.course-item .dot { width: 12px; height: 12px; border-radius: 4px; background: var(--course); flex: none; }
.course-item .nm { min-width: 0; line-height: 1.25; overflow-wrap: anywhere; }
.side-foot { margin: 22px 0 0 14px; font-size: 0.78rem; color: var(--ink-3); line-height: 1.9; }
.side-foot summary { cursor: pointer; list-style: none; font-weight: 500; }
.side-foot summary::-webkit-details-marker { display: none; }
.side-foot summary::before { content: "⌨  "; }
.side-foot summary:hover { color: var(--ink-2); }
.kbd { font: 600 0.72rem/1 var(--f-ui); padding: 2px 6px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; background: var(--card); color: var(--ink-2); }

/* List header */
.list-wrap { grid-area: main; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
.list-head { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; padding: 4px 4px 0; }
.list-head h1 { margin: 0; font-size: 1.7rem; line-height: 1.1; font-weight: 700; letter-spacing: -0.01em; }
.list-head p { margin: 4px 0 0; color: var(--ink-3); font-size: 0.9rem; }
.list-head p .late { color: var(--alert); font-weight: 700; }
.list-head .grow { flex: 1; min-width: 200px; }
.list-head.course { padding: 22px 24px 18px; border-radius: var(--radius); background: var(--course); color: #fff; position: relative; overflow: hidden; }
.list-head.course::after { content: ""; position: absolute; right: -40px; top: -60px; width: 200px; height: 200px; border-radius: 50%; background: rgba(255, 255, 255, 0.12); box-shadow: -70px 80px 0 rgba(255, 255, 255, 0.06); }
.list-head.course p { color: rgba(255, 255, 255, 0.88); }
.list-head.course .pill-btn { position: relative; z-index: 1; background: rgba(255, 255, 255, 0.2); color: #fff; }

/* Task list (Google Tasks style) */
.list { padding: 6px 0; }
.group + .group { border-top: 1px solid var(--line); }
.group-head { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: transparent; padding: 14px 20px 6px; text-align: left; }
.group-head h2 { margin: 0; font-size: 0.95rem; font-weight: 700; }
.group-head .n { font: 400 17px/1 var(--f-num); color: var(--ink-3); }
.group-head .chev { margin-left: auto; color: var(--ink-3); transition: transform 0.15s; }
.group.closed .chev { transform: rotate(-90deg); }
.group.closed .tasks { display: none; }
.group.over { background: color-mix(in srgb, var(--mint) 55%, transparent); }
.group-overdue .group-head h2, .group-overdue .group-head .n { color: var(--alert); }
.group-note { margin: 0 20px 6px 62px; font-size: 0.8rem; color: var(--ink-3); }
.linkish { border: 0; background: none; padding: 0; margin-left: 8px; color: var(--sage-deep); font: inherit; font-size: inherit; font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.tasks { list-style: none; margin: 0; padding: 0 0 8px; }
.tasks .none { padding: 6px 20px 10px 62px; font-size: 0.86rem; color: var(--ink-3); }
.drop-hint { height: 3px; margin: 0 20px 0 58px; border-radius: 3px; background: var(--sage-deep); }

.task { position: relative; }
.task-row { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto auto 32px 28px; align-items: center; gap: 4px 14px; padding: 9px 12px 9px 20px; cursor: pointer; border-radius: 0; }
.task-row:hover { background: var(--card-2); }
.task.dragging { opacity: 0.35; }
.task:focus-visible { outline: none; }
.task:focus-visible .task-row { box-shadow: inset 3px 0 0 var(--sage-deep); background: var(--card-2); }
.check { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--ink-3); background: transparent; padding: 0; display: grid; place-items: center; }
.check:hover { border-color: var(--sage-deep); }
.task.finishing .check { background: var(--sage-deep); border-color: var(--sage-deep); animation: checkPop 0.26s ease-out; }
.task.finishing .check::after { content: ""; width: 9px; height: 5px; border-left: 2px solid #fff; border-bottom: 2px solid #fff; transform: rotate(-45deg) translate(1px, -1px); }
.task.finishing .task-title { color: var(--ink-3); text-decoration: line-through; transition: color 0.2s; }
@keyframes checkPop { 0% { transform: scale(0.8); } 55% { transform: scale(1.25); } 100% { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { .task.finishing .check { animation: none; } }
.check:hover::after, .task.is-done .check::after { content: ""; width: 9px; height: 5px; border-left: 2px solid var(--sage-deep); border-bottom: 2px solid var(--sage-deep); transform: rotate(-45deg) translate(1px, -1px); }
.task.is-done .check { background: var(--sage-deep); border-color: var(--sage-deep); }
.task.is-done .check::after { border-color: var(--card); }
.task-main { min-width: 0; }
.task-title { font-size: 1rem; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
.task.is-done .task-title { text-decoration: line-through; color: var(--ink-3); font-weight: 500; }
.task-sub { display: flex; align-items: center; flex-wrap: wrap; gap: 2px 12px; margin-top: 3px; font-size: 0.8rem; color: var(--ink-3); }
.task-sub .crs { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; color: var(--ink-2); }
.task-sub .crs::before { content: ""; width: 8px; height: 8px; border-radius: 3px; background: var(--course); }
.task-sub .warn { color: var(--alert); font-weight: 600; }
.task-sub .ok { color: var(--ok); font-weight: 600; }
.due-pill { justify-self: end; font-size: 0.8rem; font-weight: 600; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; }
.due-pill.alert { background: var(--alert-bg); border-color: transparent; color: var(--alert); }
.due-pill.passed { border-style: dashed; color: var(--ink-3); }
.task.is-passed .task-title { color: var(--ink-2); }
.warn-line { padding: 10px 14px; border-radius: 12px; background: var(--alert-bg); color: var(--alert); font-size: 0.9rem; font-weight: 600; }
.group-head .peek { min-width: 0; font-size: 0.82rem; line-height: 1.3; color: var(--ink-3); font-weight: 500; }
.due-pill.warn { background: var(--warn-bg); border-color: transparent; color: var(--warn); }
.task.is-done .due-pill { opacity: 0.6; }
/* Start: shows on hover/focus; stays visible (with the running time) on the one on the clock. */
.go { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); background: var(--card); color: var(--ink-2); border-radius: 999px; padding: 4px 11px 4px 8px; font-size: 0.8rem; font-weight: 600; opacity: 0; font-variant-numeric: tabular-nums; }
.go .ico { width: 13px; height: 13px; }
.go .ico svg { fill: currentColor; stroke-width: 1.5; }
.task-row:hover .go, .task:focus-within .go, .go.on { opacity: 1; }
.go:hover { border-color: var(--sage-deep); color: var(--ink); }
.go.on { background: var(--mint); border-color: transparent; color: var(--ink); }
.task.is-active .task-row { box-shadow: inset 3px 0 0 var(--sage-deep); }
.plan-it { border: 1px dashed var(--sage-deep); background: transparent; color: var(--sage-deep); border-radius: 999px; padding: 1px 9px; font-size: 0.76rem; font-weight: 700; }
.plan-it:hover { background: var(--mint); border-style: solid; }
.task:not(:hover):not(:focus-within):not(.open):not(.sel) .plan-it { display: none; }
.star { width: 32px; height: 32px; border-radius: 50%; border: 0; background: transparent; color: var(--ink-3); display: grid; place-items: center; padding: 0; opacity: 0; }
.task-row:hover .star, .task:focus-within .star, .star.on { opacity: 1; }
.star:hover { background: var(--page-2); color: var(--ink); }
.star.on { color: var(--warn); }
.star.on svg { fill: currentColor; }

.task-detail { margin: 0 20px 10px 60px; padding: 14px 16px; border-radius: 12px; background: var(--card-2); display: flex; flex-direction: column; gap: 10px; border-left: 4px solid var(--course); }
.task-detail .line { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; font-size: 0.88rem; color: var(--ink-2); }
.task-detail .line b { color: var(--ink); font-weight: 600; }
.task-detail .find { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.task-detail .find button, .task-detail .act { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 4px 12px; font-size: 0.8rem; font-weight: 600; }
.task-detail .find button:hover, .task-detail .act:hover { border-color: var(--sage-deep); }
.task-detail .note { font-size: 0.82rem; color: var(--ok); font-weight: 600; }
.task-detail .note.err { color: var(--alert); }
.mini-steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.mini-steps .step { padding: 6px 10px; font-size: 0.88rem; background: var(--card); }
.mini-steps .step .box { width: 16px; height: 16px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; font-size: 0.78rem; font-weight: 600; background: var(--card-2); color: var(--ink-2); white-space: nowrap; }
.chip.course { color: #fff; background: var(--course, var(--sage-deep)); }
.chip.alert { background: var(--alert-bg); color: var(--alert); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.ok { background: var(--mint); color: var(--ok); }
.chip.rule { background: transparent; border: 1px dashed var(--alert); color: var(--alert); }
.mode-k { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 4px; background: var(--ink); color: var(--card); font: 400 10px/1 var(--f-label); }

/* Steps (shared) */
.step { display: flex; align-items: flex-start; gap: 10px; padding: 8px 10px; border-radius: 10px; background: var(--card-2); border: 1px solid transparent; cursor: pointer; text-align: left; width: 100%; font-size: 0.92rem; line-height: 1.35; }
.step:hover { border-color: var(--line); }
.step .box { flex: none; width: 18px; height: 18px; margin-top: 1px; border: 2px solid var(--ink-2); border-radius: 5px; display: grid; place-items: center; }
.step.digest .box { border-radius: 50%; border-style: dashed; }
.step.done { color: var(--ink-3); }
.step.done .t { text-decoration: line-through; }
.step.done .box { background: var(--sage-deep); border-color: var(--sage-deep); }
.step.done .box::after { content: ""; width: 8px; height: 4px; border-left: 2px solid var(--card); border-bottom: 2px solid var(--card); transform: rotate(-45deg) translate(1px, -1px); }
.step.first:not(.done) { background: var(--mint); }
.step .tag { margin-left: auto; flex: none; font: 400 9px/1.6 var(--f-label); letter-spacing: 0.06em; color: var(--ink-3); text-transform: uppercase; }

/* Right rail: check-in, now, today */
.rail { grid-area: rail; position: sticky; top: 82px; display: flex; flex-direction: column; gap: 14px; max-height: calc(100vh - 100px); overflow-y: auto; padding-bottom: 4px; }
.rail > * { flex-shrink: 0; }
.side > * { flex-shrink: 0; }
.checkin { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 14px 16px; border-radius: var(--radius); background: var(--ink); color: var(--card); }
.checkin p { margin: 0 0 4px; flex: 1 1 100%; font-weight: 600; font-size: 0.92rem; }
.checkin .inp.jr { width: 100%; margin: 8px 0; font-size: 0.86rem; padding: 7px 10px; background: color-mix(in srgb, var(--card) 12%, transparent); border-color: color-mix(in srgb, var(--card) 30%, transparent); color: var(--card); }
.checkin .inp.jr::placeholder { color: color-mix(in srgb, var(--card) 60%, transparent); }
.checkin .pill-btn { background: var(--card); color: var(--ink); }
.checkin .pill-btn.sage { background: var(--sage); color: #10261a; }
.night-list { list-style: none; margin: 0 0 4px; padding: 0; flex: 1 1 100%; display: flex; flex-direction: column; gap: 6px; }
.night-list li { display: flex; align-items: center; gap: 8px; }
.night-list .nm { flex: 1; min-width: 0; font-size: 0.84rem; line-height: 1.3; }
.night-list .seg { display: inline-flex; border-radius: 999px; background: rgba(255, 255, 255, 0.12); padding: 2px; }
.night-list .seg button { border: 0; background: transparent; color: inherit; font-size: 0.72rem; font-weight: 600; padding: 3px 8px; border-radius: 999px; opacity: 0.7; }
.night-list .seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); opacity: 1; }
.night-list .seg button.implied[aria-pressed="true"] { background: rgba(255, 255, 255, 0.28); color: inherit; }
.first-move .label { white-space: nowrap; }
.first-move { margin: 0; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; background: var(--mint); font-size: 0.92rem; }
.now { padding: 16px 18px 16px 22px; position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 8px; }
.now::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 5px; background: var(--course, var(--sage)); }
.now .head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.now h1 { margin: 0; font-size: 1.25rem; line-height: 1.25; font-weight: 700; }
.now .meta { color: var(--ink-2); font-size: 0.86rem; display: flex; flex-direction: column; gap: 2px; }
.now .meta b { color: var(--ink); font-weight: 600; }
.now .side-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.now .big-time { font: 400 40px/0.9 var(--f-num); color: var(--ink); }
.now .big-time small { display: block; font: 400 9px/1.6 var(--f-label); letter-spacing: 0.08em; color: var(--ink-3); text-transform: uppercase; }
.progress { height: 6px; border-radius: 99px; background: var(--card-2); overflow: hidden; }
.progress span { display: block; height: 100%; background: var(--sage-deep); border-radius: 99px; }
.steps-big { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; gap: 5px; }
.empty-now { color: var(--ink-2); font-size: 0.9rem; margin: 0; }
.empty-now.err { color: var(--alert); }
/* The top of To do: what to do now and the button that starts it. */
.now.hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px 28px; padding: 20px 24px 20px 30px; align-items: stretch; }
.now.hero.is-on { background: linear-gradient(90deg, var(--mint), var(--card) 70%); }
.now.hero.night { background: var(--card-2); }
.now.hero.exam-hero { background: linear-gradient(90deg, var(--alert-bg), var(--card) 70%); }
.now.hero.plan .meta .warn { color: var(--alert); font-weight: 600; }
.now.hero.night h1 { font-size: 1.35rem; }
body.night .list, body.night .exams, body.night .filters, body.night .dup-line, body.night .rail { opacity: 0.55; transition: opacity 0.3s; }
body.night .list:hover, body.night .list:focus-within, body.night .rail:hover, body.night .rail:focus-within { opacity: 1; }
body.night .composer { display: none; }
.hero-main { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.now.hero h1 { font-size: 1.55rem; line-height: 1.2; overflow-wrap: anywhere; }
.now.hero .meta { font-size: 0.9rem; }
.hero-act { display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between; gap: 14px; min-width: 150px; }
.hero-act .big-time { font: 400 52px/0.9 var(--f-num); text-align: right; color: var(--ink); font-variant-numeric: tabular-nums; }
.hero-act .big-time small { display: block; margin-top: 6px; font: 400 9px/1.6 var(--f-label); letter-spacing: 0.08em; color: var(--ink-3); text-transform: uppercase; }
.hero-act .btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.pill-btn.big { padding: 11px 20px; font-size: 0.95rem; display: inline-flex; align-items: center; gap: 7px; }
.pill-btn.big .ico { width: 14px; height: 14px; }
.pill-btn.big .ico svg { fill: currentColor; }
.hero-next { margin: 2px 0 0; font-size: 0.82rem; color: var(--ink-3); }
.now.hero .first-move { align-self: flex-start; }
@media (max-width: 820px) { .now.hero { grid-template-columns: 1fr; } .hero-act { align-items: stretch; flex-direction: row; justify-content: space-between; align-items: flex-end; } }
/* Exams in the next 10 days */
.exams { display: flex; flex-wrap: wrap; gap: 8px; }
.exam { text-align: left; display: flex; flex-direction: row; align-items: baseline; flex-wrap: wrap; gap: 2px 10px; padding: 7px 12px 7px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); position: relative; overflow: hidden; }
.exam::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--course); }
.exam:hover { border-color: var(--sage-deep); }
.exam .nm { font-weight: 700; font-size: 0.88rem; line-height: 1.25; overflow-wrap: anywhere; }
.exam .when { font-size: 0.82rem; color: var(--ink-2); }
.exam .prep { font-size: 0.78rem; font-weight: 600; color: var(--ok); }
.exam .prep.none { color: var(--ink-3); }
.exam.thin .prep { color: var(--alert); }
.today-card { padding: 16px 16px 12px; }
.today-card h2 { margin: 0; font-size: 0.95rem; font-weight: 700; }
.agenda { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; }
.agenda li { display: grid; grid-template-columns: 46px 4px minmax(0, 1fr); gap: 10px; padding: 6px 0; align-items: start; }
.agenda .when { font: 400 17px/1.1 var(--f-num); color: var(--ink-2); }
.agenda .bar { align-self: stretch; border-radius: 3px; background: var(--course, var(--line)); }
.agenda .what { min-width: 0; }
.agenda .what b { display: block; font-weight: 600; font-size: 0.88rem; line-height: 1.3; }
.agenda .what span { font-size: 0.76rem; color: var(--ink-3); }
.agenda li.past { opacity: 0.45; }
.agenda li.live .what b::after { content: " · now"; color: var(--ok); font-weight: 700; }
.agenda li.rated-done .what b::before { content: "✓ "; color: var(--ok); }
.agenda li.rated-missed .what b { text-decoration: line-through; }
.today-card .foot { margin-top: 8px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 0.78rem; color: var(--ink-3); }

/* ---------- Classes (Google Classroom style) ---------- */
.courses { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.course-card { overflow: hidden; display: flex; flex-direction: column; min-height: 280px; }
.course-card .banner { padding: 16px 18px 14px; background: var(--course); color: #fff; position: relative; min-height: 104px; display: flex; flex-direction: column; justify-content: flex-end; border: 0; text-align: left; width: 100%; }
.course-card .banner::after { content: ""; position: absolute; right: -30px; top: -30px; width: 130px; height: 130px; border-radius: 50%; background: rgba(255, 255, 255, 0.12); box-shadow: -40px 50px 0 rgba(255, 255, 255, 0.06); }
.course-card .banner b { font-size: 1.3rem; line-height: 1.2; position: relative; }
.course-card .banner b:hover { text-decoration: underline; }
.course-card .banner span { font-size: 0.82rem; opacity: 0.9; position: relative; }
.course-card .badge { position: absolute; right: 16px; bottom: -22px; z-index: 1; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--card); border: 3px solid var(--card); box-shadow: var(--shadow); font: 400 22px/1 var(--f-num); color: var(--course); }
.course-card .body { position: relative; }
.course-card .lbl { padding: 14px 18px 2px; }
.course-card ul { list-style: none; margin: 0; padding: 4px 10px 8px; display: flex; flex-direction: column; }
.course-card li { display: flex; align-items: baseline; gap: 10px; padding: 8px 8px; border-radius: 8px; }
.course-card li + li { border-top: 1px solid var(--line); }
.course-card li .when { flex: none; width: 74px; font-size: 0.78rem; font-weight: 700; color: var(--ink-2); }
.course-card li .when.soon { color: var(--alert); }
.course-card li .what { flex: 1; min-width: 0; font-weight: 600; font-size: 0.9rem; }
.course-card li .h { flex: none; font-size: 0.76rem; color: var(--ink-3); }
.course-card li .h.zero { color: var(--alert); font-weight: 700; }
.course-card .nothing { padding: 14px 18px; color: var(--ink-3); font-size: 0.88rem; }
.course-card .foot { margin-top: auto; padding: 10px 12px 10px 18px; border-top: 1px solid var(--line); font-size: 0.8rem; color: var(--ink-2); display: flex; align-items: center; gap: 10px; }
.course-card .foot span { flex: 1; min-width: 0; }
.linkish { border: 0; background: none; padding: 0; color: var(--sage-deep); font-weight: 700; font-size: 0.82rem; }
.linkish:hover { text-decoration: underline; }

/* ---------- Setup ---------- */
.setup { max-width: 480px; margin: 12vh auto; padding: 28px; }
.setup h1 { margin: 0 0 6px; font-size: 1.5rem; }
.setup p { color: var(--ink-2); margin: 0 0 16px; }
.setup label { display: block; font-weight: 600; font-size: 0.85rem; margin: 12px 0 4px; }
.setup input { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card-2); color: var(--ink); font: inherit; }
.setup .msg { min-height: 1.4em; margin-top: 10px; color: var(--alert); font-size: 0.88rem; }

@media (max-width: 1240px) {
  .shell { grid-template-columns: 210px minmax(0, 1fr); grid-template-areas: "side main" "side rail"; }
  .rail { position: static; max-height: none; overflow: visible; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); align-items: start; }
  .brand { width: auto; }
}
@media (max-width: 820px) {
  .top { flex-wrap: wrap; height: auto; padding: 10px 16px; gap: 10px 14px; }
  .shell { grid-template-columns: minmax(0, 1fr); grid-template-areas: "side" "main" "rail"; padding: 14px 16px 40px; gap: 16px; }
  .side { position: static; flex-direction: row; flex-wrap: wrap; overflow: visible; max-height: none; gap: 6px; padding-bottom: 4px; }
  .nav-item, .course-item { margin-left: 0; width: auto; padding: 8px 14px; border-radius: 999px; white-space: nowrap; flex: none; }
  .side-label, .side-foot { display: none; }
  .side > .new-wrap, .side > .search-btn { flex: none; width: auto; margin: 0; }
  .new-btn { padding: 8px 12px; }
  .search-btn .kbd { display: none; }
  .task-row { grid-template-columns: 26px minmax(0, 1fr) 32px; padding-left: 14px; }
  .task-row .star { grid-column: 3; grid-row: 1; opacity: 1; }
  .due-pill { grid-column: 2; grid-row: 2; justify-self: start; }
  .task-detail { margin-left: 14px; margin-right: 14px; }
  .group-head { padding-left: 14px; }
  .tasks .none { padding-left: 54px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
/* ---------- Adding and editing ---------- */
/* Composer: one box for tasks and blocks */
.composer { display: flex; flex-direction: column; gap: 8px; padding: 12px 18px; border-bottom: 1px solid var(--line); flex-wrap: nowrap; align-items: stretch; }
.composer.open { background: var(--card); box-shadow: inset 0 0 0 2px var(--sage-deep); border-radius: var(--radius) var(--radius) 0 0; padding-bottom: 12px; }
.composer .c-row { display: flex; align-items: center; gap: 8px; }
.composer .c-inp { flex: 1 1 auto; min-width: 0; font-size: 1rem; background: transparent; border-color: transparent; padding: 7px 8px; }
.composer .c-inp:focus { outline: none; }
.composer:not(.open) .c-chips, .composer:not(.open) .c-notes, .composer:not(.open) .seg { display: none; }
.composer .c-chips { display: flex; gap: 12px; align-items: flex-start; padding-left: 34px; }
.composer .cc { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.composer .ca { flex: none; display: flex; gap: 10px; align-items: center; }
@media (max-width: 1100px) { .composer .hint.keys { display: none; } }
.composer .c-notes { margin-left: 34px; width: calc(100% - 34px); resize: vertical; min-height: 54px; }
.composer .hint.keys { font-size: 0.74rem; color: var(--ink-3); }
.composer .c-add { padding: 7px 16px; }
.composer .durs { display: inline-flex; gap: 4px; }
.shake { animation: shake 0.35s; }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.seg { display: inline-flex; background: var(--card-2); border-radius: 999px; padding: 3px; flex: none; }
.seg button { border: 0; background: transparent; color: var(--ink-2); border-radius: 999px; padding: 4px 12px; font-size: 0.8rem; font-weight: 700; }
.seg button[aria-selected="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12); }
.chip-btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--card); color: var(--ink-2); border-radius: 8px; padding: 4px 10px; font-size: 0.8rem; font-weight: 600; max-width: 260px; }
.chip-btn:hover { border-color: var(--sage-deep); color: var(--ink); }
.chip-btn .cl { color: var(--ink-3); font-weight: 600; }
.chip-btn .cv { color: var(--ink); font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip-btn.soft { border-style: dashed; }
.chip-btn.set.star-chip, .chip-btn.star-chip[aria-pressed="true"] { color: var(--gold, #b88a2e); border-color: currentColor; }
.chip-btn .ico { width: 14px; height: 14px; }
.chip-btn .dot, .mi .dot, .pal-row .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; display: inline-block; }
.clash { color: var(--alert); font-size: 0.78rem; font-weight: 600; }
.hint.clash:empty { display: none; }
.task-list .add-row, .tasks .add-row { list-style: none; }
.add-row button { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: transparent; color: var(--ink-3); padding: 9px 20px 9px 22px; font-size: 0.88rem; text-align: left; }
.add-row button:hover { color: var(--sage-deep); background: var(--card-2); }
.group:not(.is-empty) .add-row { max-height: 0; overflow: hidden; opacity: 0; transition: max-height 0.18s ease, opacity 0.18s ease; }
.group:not(.is-empty):hover .add-row, .group:not(.is-empty):focus-within .add-row, .group.over .add-row { max-height: 60px; opacity: 1; }
.add-row .plus { width: 18px; text-align: center; font-weight: 700; font-size: 1.05rem; }
.task.pending, .tl-ev.pending { opacity: 0.55; }
.task.pending .task-title::after { content: " · saving…"; color: var(--ink-3); font-weight: 500; }
.more-btn { width: 28px; height: 28px; border: 0; background: transparent; color: var(--ink-3); border-radius: 8px; font-size: 18px; line-height: 1; opacity: 0; }
.task-row:hover .more-btn, .task:focus-within .more-btn { opacity: 1; }
.more-btn:hover { background: var(--card-2); color: var(--ink); }
button.due-pill:hover { box-shadow: inset 0 0 0 1px var(--sage-deep); }
.inline-edit { font: inherit; font-weight: 600; width: 100%; padding: 3px 6px; margin: -4px 0; }

  background: color-mix(in srgb, var(--course) 16%, var(--card)); border-left: 3px solid var(--course); color: var(--ink); user-select: none; }

<body>
<div id="app"></div>
<!-- Editor: opens from any block, the day list, a deadline, or "+ Block". -->

<!-- Full-screen focus: click the timer (or press F) to open; Esc, F, Exit or clicking the time closes it. -->
<div class="fs" id="fs" role="dialog" aria-label="Focus mode" hidden>
  <div class="fs-top"><span class="label" id="fs-phase">Focus</span><span class="label" id="fs-clock"></span></div>

  </div>

<script>
/* If anything on this page fails to load or run, say so on screen instead of showing a blank page. */
(function () {
  var shown = false;
  function show(msg) {
    if (shown) return; shown = true;
    var box = document.createElement("div");
    box.setAttribute("role", "alert");
    box.style.cssText = "position:fixed;left:16px;right:16px;bottom:16px;z-index:99;padding:14px 16px;border-radius:12px;background:#7a2e22;color:#fff;font:14px/1.45 system-ui,sans-serif;box-shadow:0 8px 30px rgba(0,0,0,.3)";
    box.textContent = "Desk Board hit a problem: " + msg + ". Try reloading with Cmd+Shift+R. If it stays, send a screenshot of this.";
    (document.body || document.documentElement).appendChild(box);
  }
  window.addEventListener("error", function (e) {
    var t = e.target;
    if (t && t !== window && (t.src || t.href)) { if (t.tagName === "SCRIPT") show("couldn't load " + t.src.split("/").pop()); return; }   // a missing font is fine
    else show((e.message || "script error") + (e.filename ? " (" + e.filename.split("/").pop() + ":" + e.lineno + ")" : ""));
  }, true);
  window.addEventListener("unhandledrejection", function (e) { var r = e.reason; if (r && r.message && !/fetch|network|abort/i.test(r.message)) show(r.message); });
  window.addEventListener("load", function () { if (typeof buildDeadlines !== "function") show("rules.js didn't load (an old cached copy, or a blocker)"); });
})();
</script>
<script src="rules.js"></script>
<script src="shorten.js"></script>
<script>

/* ================= Desktop board ================= */

// Steps with their state, for ticking: { text (as written), show, digest, done }.
function stepsFrom(text) {
  const out = [];
  text.split(/\n/).forEach((line) => {
    const m = /^\s*(?:[-•*·]|\d+[.)])\s+(?:\[([ xX]?)\]\s*)?(.+)/.exec(line) || /^\s*()\[([ xX]?)\]\s+(.+)/.exec(line);
    if (!m) return;
    const box = m.length > 3 ? m[2] : m[1], txt = (m.length > 3 ? m[3] : m[2]).trim();
    if (!txt) return;
    const dg = /^digest\s*:\s*/i.exec(txt);
    out.push({ text: txt, show: dg ? txt.slice(dg[0].length) : txt, digest: !!dg, done: /x/i.test(box || "") });
  });
  return out.slice(0, 12);
}
function parseEvents(list) {
  return (Array.isArray(list) ? list : []).map((e) => {
    const allDay = !!e.allDay;
    let start, end;
    if (allDay) { start = localDate(e.startDate); end = e.endDate ? localDate(e.endDate) : start + DAY; }
    else { start = Number(e.start); end = Number(e.end); }
    const text = plainText(e.desc);
    const ci = /^\s*Check-in:\s*(Done|Partly|Missed)/im.exec(text);
    return {
      id: String(e.id || ""), src: String(e.cal || "primary"), title: String(e.title || "Busy"), where: String(e.where || ""),
      allDay, start, end, checkin: ci ? ci[1].toLowerCase() : null, moved: /^\s*Moved to:/im.test(text), movedFrom: /^\s*Moved from:/im.test(text),
      rec: !!e.rec, url: String(e.url || ""), notes: e.cal === "study" || e.cal === "canvas" ? "" : text.trim(),
      worked: ((w) => w ? Number(w[1] || 0) * 60 + Number(w[2] || 0) : 0)(/^\s*Worked:\s*(?:(\d+)h)?\s*(?:(\d+)m)?/im.exec(text)),
      steps: e.cal === "canvas" ? [] : stepsFrom(text), modes: e.cal === "canvas" ? [] : modesFrom(text)
    };
  }).filter((e) => !isNaN(e.start) && !isNaN(e.end));
}

// Conditional children: append(cond ? node : null) adds nothing, instead of the text "null".
["append", "replaceChildren"].forEach((m) => { const orig = Element.prototype[m]; Element.prototype[m] = function (...kids) { return orig.apply(this, kids.flat().filter((k) => k != null && k !== false)); }; });
const $ = (sel, root) => (root || document).querySelector(sel);
const h = (tag, attrs, ...kids) => {
  const el = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "style") el.setAttribute("style", v);
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "text") el.textContent = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  kids.flat().forEach((c) => { if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(String(c))); });
  return el;
};
function store(key, val) {
  try { if (val === undefined) return JSON.parse(localStorage.getItem(key) || "null"); localStorage.setItem(key, JSON.stringify(val)); }
  catch (e) { return null; }
}

/* ---------- Courses: names and colors ---------- */
// Every course in the four-year plan, most specific first. Which ones are "current" comes
// from the Classes calendar, so the board switches over by itself each semester.
const COURSE_LIST = [
  ["AP", "Advanced Programming", "#4f739c", /advanced programming|coms\s*w?3157|\bap\b/i],
  ["Lit Hum", "Literature Humanities", "#a5643b", /lit\s*hum|literature hum|huma\s*(cc)?\s*100[12]|odyssey|iliad|aeneid|symposium/i],
  ["UW", "University Writing", "#7d5fa0", /\buw\b|university writing|engl\s*(cc)?\s*1010/i],
  ["Econ", "Economics", "#3f8461", /\becon|economics|\bwr\s*\d|\b1105\b/i],
  ["Chinese", "Chinese", "#b0444a", /chinese|\bchn\b|chns|pinyin|小班|中文/i],
  ["Phys Lab", "Physics Lab", "#b88a2e", /phys(ics)?\s*lab|experimental phys|1494|ac circuits|polarization|interference/i],
  ["Physics II", "Physics II: E&M", "#c27a2c", /physics\s*(ii|2)\b|phys\w*\s*140[25]|e\s*&\s*m\b|magnetism/i],
  ["Gen Chem", "General Chemistry", "#2f7f86", /gen(eral)?\.?\s*chem|chemistry|\bchem\b|chem\w*\s*140[35]/i],
  ["Computing", "Intro to Computing (Python)", "#5a6fb0", /intro(duction)?\s*to\s*comp|computing|engi\s*e?1006|python/i],
  ["Discrete", "Discrete Math", "#6b5ea8", /discrete/i],
  ["Lin Alg", "Linear Algebra", "#3d7d9a", /linear algebra|lin\.?\s*alg|apma\s*e?3101/i],
  ["Comp Systems", "Fundamentals of Computer Systems", "#557a8f", /fundamentals of computer|computer systems|csee\s*w?3827/i],
  ["EMP", "Earth, Moon & Planets", "#4c8a7a", /earth,?\s*moon/i],
  ["Music Hum", "Music Humanities", "#a0586e", /music hum/i],
  ["PE", "Physical Education", "#7a8a3a", /\bpe\b|physical education|phed/i],
  ["Probability", "Probability", "#6a7f3c", /probability|ieor/i],
  ["3D UI", "3D UI & AR", "#8a5a9a", /3d\s*ui|augmented reality|4172/i],
  ["UI Design", "User Interface Design", "#c06a4a", /ui design|user interface|4170/i],
  ["Databases", "Databases", "#4a7aa0", /databases?|coms\s*w?4111/i],
  ["Startups", "Innovation & Entrepreneurship", "#b5713a", /entrepreneur|innovation/i],
  ["Theory", "CS Theory", "#5f5a9a", /cs theory|computer science theory|3261/i],
  ["Neuro", "Neurobiology Seminar", "#8a5a7a", /neurobiology|\bhart\b/i],
  ["ASE", "Advanced Software Engineering", "#3f6f8f", /software engineering|\base\b|4156/i],
  ["AI", "Artificial Intelligence", "#2f6f6f", /\bai\b|artificial intelligence|4701/i],
  ["Graphics", "Computer Graphics", "#7a5aa0", /graphics|4160/i],
  ["Psych", "Science of Psychology", "#9a5a5a", /psychology|psyc\w*\s*1001/i],
  ["Stars", "Stars and Atoms", "#6a6aa0", /stars and atoms|1836/i],
  ["NLP", "Natural Language Processing", "#3a7a5a", /\bnlp\b|natural language/i],
  ["Exoplanets", "Exoplanets & Astrobiology", "#4a6a9a", /exoplanet|astrobio/i],
  ["Stress", "Stress and the Brain", "#9a6a4a", /stress and the brain|4493/i]
];
const COURSES = {};
COURSE_LIST.forEach(([k, name, color, rx]) => { COURSES[k] = { name, color, rx }; });
// Words that could mean more than one course ("Phys report") go to whichever one you're taking now.
const AMBIGUOUS = [[/\bphys(ics)?\b/i, ["Phys Lab", "Physics II"]], [/\bchem\b/i, ["Gen Chem"]], [/\bcs\b|\bcoms\b/i, ["AP", "Discrete", "Theory", "Databases"]]];
const OTHER = { name: "Other", color: "#77806f" };
// Rules a class sets that the board keeps in front of you. UW's syllabus bans AI for every part of the course.
const COURSE_RULES = { UW: "No AI in this class: every word is yours" };
const ruleChip = (k) => (k && COURSE_RULES[k] ? h("span", { class: "chip rule", title: "From the syllabus", text: COURSE_RULES[k] }) : null);
let activeCourses = [];
function refreshActiveCourses() {
  const seen = {};
  events.forEach((e) => { if (e.src === "classes" && !e.allDay) { const k = matchCourse(e.title); if (k) seen[k] = 1; } });
  activeCourses = COURSE_LIST.map((c) => c[0]).filter((k) => seen[k]);
}
function matchCourse(t) {
  for (const [k, , , rx] of COURSE_LIST) if (rx.test(t)) return k;
  return null;
}
function courseOf(text) {
  const t = String(text || "");
  const direct = matchCourse(t);
  if (direct) return direct;
  for (const [rx, keys] of AMBIGUOUS) if (rx.test(t)) return keys.find((k) => activeCourses.includes(k)) || keys[0];
  return null;
}
const colorOf = (k) => (k && COURSES[k] ? COURSES[k].color : OTHER.color);
const nameOf = (k) => (k && COURSES[k] ? COURSES[k].name : OTHER.name);

/* ---------- Connection ---------- */
function readConfig() {
  let c = null;
  try {
    const hp = new URLSearchParams(location.hash.slice(1));
    if (hp.get("u") && hp.get("k")) { c = { url: hp.get("u"), key: hp.get("k") }; store("deskboard", c); history.replaceState(null, "", location.pathname); }
  } catch (e) {}
  if (!c) c = store("deskboard");
  return c && c.url && c.key ? c : null;
}
let cfg = readConfig();
function timedFetch(url, opts) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 25000);
  return fetch(url, Object.assign({ signal: ctrl.signal, redirect: "follow" }, opts)).finally(() => clearTimeout(timer));
}
function readJson(r) {
  return r.text().then((t) => {
    try { return JSON.parse(t); } catch (e) { throw { error: "not_json" }; }
  });
}
function apiGet(action, c) {
  c = c || cfg;
  const sep = c.url.indexOf("?") < 0 ? "?" : "&";
  return timedFetch(c.url + sep + "action=" + action + "&key=" + encodeURIComponent(c.key), { cache: "no-store" }).then(readJson);
}
function apiPost(body) {
  body.key = cfg.key;
  return timedFetch(cfg.url, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) })
    .then(readJson).then((d) => { if (!d || !d.ok) throw d || {}; return d; });
}

/* ---------- State ---------- */
let events = [], stats = [], conn = { ok: false, at: 0, error: "" }, sources = {}, calIds = {}, owner = "";
let doneDue = {}, layout = {}, holdLayoutUntil = 0, srv = {};   // srv: reviewed day, last tap anywhere, last fresh start
const localChecks = {}, localSteps = {}, doneIntent = {};
let view = store("deskboard-view") || "todo";
let moveOffer = null, checkNote = null, cardNotes = {}, nightNote = null;
let dragging = null;

const cache = store("deskboard-cache");
if (cache && cache.events && Date.now() - cache.at < 36 * 3600000) {
  events = parseEvents(cache.events);
  stats = cache.stats || [];
  sources = cache.sources || {};
  calIds = cache.calendars || {}; owner = cache.owner || "";
  conn = { ok: true, at: cache.at, stale: true };
  if (cache.state) { doneDue = cache.state.doneDue || {}; layout = cache.state.layout || {}; ["reviewed", "lastActive", "resetAt"].forEach((k) => { if (k in cache.state) srv[k] = cache.state[k]; }); }
}

function applyState(s) {
  if (!s) return;
  if (s.doneDue) doneDue = s.doneDue;
  ["reviewed", "lastActive", "resetAt", "dueWorked"].forEach((k) => { if (k in s) srv[k] = s[k]; });
  if (s.layout && Date.now() > holdLayoutUntil) layout = s.layout;
  if (s.log) log = s.log;
  if (s.worked) worked = s.worked;
  if (s.timer && Date.now() > holdTimerUntil) pomo = timerClean(s.timer);
}

let loading = false;
function load() {
  if (!cfg || loading) return;
  loading = true;
  apiGet("data").then((d) => {
    if (!d || !d.ok) throw d || {};
    events = parseEvents(d.events);
    stats = Array.isArray(d.stats) ? d.stats : stats;
    applyState(d.state);
    conn = { ok: true, at: Date.now(), stale: false };
    sources = d.sources || {};
    calIds = d.calendars || calIds; owner = d.owner || owner;
    store("deskboard-cache", { at: Date.now(), events: d.events, state: d.state, stats: d.stats, sources: d.sources, calendars: calIds, owner });
  }).catch((err) => {
    conn = Object.assign({}, conn, { stale: conn.ok, error: err && err.error === "unauthorized" ? "Wrong board key" : "Can't reach your calendar script" });
    if (!conn.ok) conn.ok = false;
  }).finally(() => { loading = false; render(); });
}

/* ---------- Deadlines with everything a card needs ---------- */
const stepKey = (ev, s) => ev.src + "|" + ev.id + "|" + ev.start + "|" + s.text;
const stepDone = (ev, s) => { const k = stepKey(ev, s); return k in localSteps ? localSteps[k] : s.done; };
const rating = (ev) => localChecks[ev.src + "|" + ev.id + "|" + ev.start] || ev.checkin;

function deadlines(now) {
  const t = now.getTime();
  const today = dayKey(now);
  return buildDeadlines(events, new Date(addDays(now, -OVERDUE_DAYS, 12))).filter((d) => d.day >= today || !(isExam(d) || /^(walk|go|head|leave|travel|commute|get)\b/i.test(d.title))).map((d) => {
    const key = dueKey(d);
    const dueEnd = dueEndOf(d);
    const course = courseOf(d.course + " " + d.raw + " " + d.title);
    const tokensKey = {};
    for (const k in d.tok) if (!GENERIC[k] && !/^\d+$/.test(k) && k.length > 1) tokensKey[k] = 1;
    const blocks = events.filter((ev) => ev.src === "study" && !ev.allDay && ev.end - ev.start >= 20 * 60000 &&
      ev.start < dueEnd && sameWork(d, tokensKey, ev.title)).sort((a, b) => a.start - b.start);
    const upcoming = blocks.filter((b) => b.end > t);
    const planned = plannedFor(events, d, now);
    return {
      key, d, course, dueEnd, title: deskTitle(d.title), pending: (d.refs || []).some((r) => String(r.id).startsWith("tmp-")),
      // A deadline whose time passed today stays in Today (faded) until you tick it or the day ends.
      done: !!doneDue[key], auto: false, past: dueEnd < t, planned, upcoming, nextBlock: upcoming[0] || null
    };
  });
}
// "Phys report due: Interference" -> "Phys report: Interference"; "UW Essay 3 due 6 PM" -> "UW Essay 3".
function deskTitle(t) {
  const s = String(t || "")
    .replace(/\s*\(due[^)]*\)/i, "")
    .replace(/\s+due\s*:\s*/i, ": ")
    .replace(/\s+due\b(?:\s+(?:at|by))?(\s+\d{1,2}(:\d{2})?\s*(am|pm|a\.m\.|p\.m\.)?)?\s*$/i, "")
    .replace(/\s+/g, " ").trim();
  return s || String(t || "");
}
function withoutCourse(title, course) {
  if (!course) return title;
  const rest = title.replace(new RegExp("^(" + course + "|" + nameOf(course) + "|chinese|chn)\\b[\\s:·-]*", "i"), "");
  return rest ? rest.charAt(0).toUpperCase() + rest.slice(1) : title;
}
function posOf(x) { const o = layout[x.key]; return o && typeof o.pos === "number" ? o.pos : null; }

/* ---------- Timer (shared with the phone board; the logic is in rules.js) ----------
   Count up (default): Start, work as long as it takes, Done logs the minutes to the block.
   25-minute rounds: the switch next to the timer. */
const LEN = TIMER_LEN;
let pomo = timerFresh("flow"), log = {}, worked = {}, holdTimerUntil = 0, lastDone = null, audio = null;
if (cache && cache.state && Date.now() - cache.at < 36 * 3600000) { log = cache.state.log || {}; worked = cache.state.worked || {}; }
function afterPost(d) { if (d && d.state) { if (d.state.log) log = d.state.log; if (d.state.worked) worked = d.state.worked; if (d.state.dueWorked) srv.dueWorked = d.state.dueWorked; } }
// After a tap, the server's copy of the timer is ignored for 30 seconds, so a refresh already
// on its way (carrying the old timer) can't undo the tap.
function pushTimer() {
  holdTimerUntil = Date.now() + 30000;
  apiPost({ action: "timer", timer: pomo }).then(afterPost, () => { holdTimerUntil = 0; });
}
/* ---------- Sound: a steady background, generated here, no files and no network ----------
   Brown and pink noise are the two with real evidence behind them for attention; the others are
   the same idea wearing a different coat. Everything loops seamlessly and drifts, so it never
   settles into a pattern you start listening to. */
const SOUNDS = [
  { id: "deep", name: "Deep", hint: "Low brown noise, like weather outside" },
  { id: "rain", name: "Rain", hint: "Steady rain, close to the window" },
  { id: "waves", name: "Waves", hint: "Slow surf, long swells" },
  { id: "fan", name: "Fan", hint: "A room fan and its hum" },
  { id: "pink", name: "Pink", hint: "Softer and brighter than Deep" },
];
let sound = null, soundId = store("deskboard-sound") || "deep";
const soundName = (id) => (SOUNDS.find((x) => x.id === id) || SOUNDS[0]).name;
function ensureAudio() {
  if (!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  try { if (audio.state === "suspended") audio.resume(); } catch (e) {}
  return audio;
}
// A few seconds of noise, looped. Brown is deep and rounded, pink is the classic hiss, white is raw.
function noiseBuf(kind, secs) {
  const sr = audio.sampleRate, len = Math.floor(sr * secs), buf = audio.createBuffer(2, len, sr);
  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch);
    if (kind === "brown") {
      let last = 0;
      for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1; last = (last + 0.008 * w) / 1.008; d[i] = last * 6; }
    } else if (kind === "pink") {
      let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
      for (let i = 0; i < len; i++) {
        const w = Math.random() * 2 - 1;
        b0 = 0.99886 * b0 + w * 0.0555179; b1 = 0.99332 * b1 + w * 0.0750759; b2 = 0.969 * b2 + w * 0.153852;
        b3 = 0.8665 * b3 + w * 0.3104856; b4 = 0.55 * b4 + w * 0.5329522; b5 = -0.7616 * b5 - w * 0.016898;
        d[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362) * 0.11; b6 = w * 0.115926;
      }
    } else for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  return buf;
}
// Rain is hiss plus thousands of little impacts. Baking them into the loop keeps the patter random.
function rainBuf(secs) {
  const buf = noiseBuf("pink", secs), sr = audio.sampleRate, len = buf.length;
  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch), drops = Math.floor(secs * 160);
    for (let n = 0; n < drops; n++) {
      const dur = Math.floor(sr * (0.003 + Math.random() * 0.011)), at = Math.floor(Math.random() * (len - dur - 1)), amp = 0.3 + Math.random() * 0.7;
      for (let i = 0; i < dur; i++) d[at + i] += (Math.random() * 2 - 1) * amp * Math.exp(-i / (dur * 0.25)) * 0.5;
    }
  }
  return buf;
}
// Each texture: a looping source or two, some filters, and slow swells that never line up.
function buildSound(id) {
  const parts = [], out = audio.createGain();
  const src = (buf) => { const n = audio.createBufferSource(); n.buffer = buf; n.loop = true; parts.push(n); return n; };

  return out;
}

  { k: "report", label: "Lab report", word: "lab report", rx: /\b(lab report|report)\b/i },
  { k: "project", label: "Project", word: "project", rx: /\b(project|presentation)\b/i },

// ---- Repeating tasks: "every mon", "every tue and thu 18:00", "weekly", "daily", "weekdays",
// with "until dec 10", "for 6 weeks" or "x6". Each one is its own event, so each can be moved or done.
function parseRepeat(s, out, now) {
  const at = (n) => dayKey(addDays(now, n, 12));
  s = s.replace(/\s(?:x|×)\s?(\d{1,2})(?=\s)|\s(?:for\s+(\d{1,2})\s+weeks|(\d{1,2})\s+times)(?=\s)/i, (m, a, b, c) => { out.count = Math.min(30, +(a || b || c)); out.hits.push(m.trim()); return " "; });

    const month = mo ? MONTHS.indexOf(mo.toLowerCase()) : +mm - 1, day = +(d || dd);
    let y = now.getFullYear(); if (new Date(y, month, day) < startOfDay(now)) y++;
    out.until = dayKey(new Date(y, month, day, 12)); out.hits.push(m.trim()); return " ";
  });
  s = s.replace(/\s(?:every\s+day|daily)(?=\s)/i, (m) => { out.repeat = { kind: "daily" }; out.hits.push(m.trim()); return " "; });
  s = s.replace(/\s(?:every\s+weekday|weekdays)(?=\s)/i, (m) => { out.repeat = { kind: "weekdays" }; out.hits.push(m.trim()); return " "; });
  s = s.replace(/\s(?:every\s+(other|2nd)\s+week|biweekly)(?=\s)/i, (m) => { out.repeat = { kind: "weekly", every: 2 }; out.hits.push(m.trim()); return " "; });
  s = s.replace(/\s(?:every\s+week|weekly)(?=\s)/i, (m) => { out.repeat = { kind: "weekly", every: 1 }; out.hits.push(m.trim()); return " "; });
  s = s.replace(/\s(?:every|each)\s+((?:(?:sun|mon|tue|wed|thu|fri|sat)[a-z]*\s*(?:,|and|&)?\s*)+)(?=\s)/i, (m, list) => {
    const days = [...new Set((list.match(/sun|mon|tue|wed|thu|fri|sat/gi) || []).map((d) => WEEKDAYS.indexOf(d.toLowerCase())))].sort();
    if (!days.length) return m;

    if (!out.day) { let n = 0; while (!days.includes(new Date(addDays(now, n, 12)).getDay()) && n < 7) n++; out.day = at(n); }

function occurrences(first, rep, count, until) {

  const max = Math.min(30, count || (rep.kind === "daily" ? 14 : rep.kind === "weekdays" ? 10 : 8));
  const out = [], start = new Date(localDate(first) + 12 * 3600000), end = until ? localDate(until) + DAY : Infinity;
  for (let i = 0; out.length < max && i < 400; i++) {

  if (frac != null) drain.firstChild.style.width = (frac * 100).toFixed(1) + "%";
  const nxt = nowTimed(now).filter((i) => i.start > t && i.start < t + 6 * 3600000).sort((a, b) => a.start - b.start)[0];
  $("#fs-tally").textContent = fmtMins(workedToday(now)) + " worked today" + (blk && blk.end > t ? " · this ends " + fmtTime(blk.end) : "") + (nxt ? " · next: " + nxt.title + " " + fmtTime(nxt.start) : "");
}
$("#fs-time").addEventListener("click", () => setFs(false));
$("#fs-exit").addEventListener("click", () => setFs(false));
$("#fs-keep").addEventListener("click", keepGoing);
$("#fs-sound").addEventListener("click", () => setSound(sound ? "off" : soundId));
$("#fs-sound-more").addEventListener("click", (e) => soundMenu(e.currentTarget));
$("#fs-toggle").addEventListener("click", () => { toggleTimer(); renderFs(new Date()); });
$("#fs-reset").addEventListener("click", () => { resetTimer(); renderFs(new Date()); });
$("#fs-discard").addEventListener("click", discardTimer);
$("#fs-mode").addEventListener("click", switchMode);
// Esc in browser full screen leaves full screen first; take the overlay down with it.
document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement && fsOpen) setFs(false); });
document.addEventListener("keydown", (e) => {
  const typing = e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName);
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); if (drawerOpen) closeDrawer(); closePop(); openPalette(); return; }
  if ((e.metaKey || e.ctrlKey) && !e.shiftKey && e.key.toLowerCase() === "z" && !typing && !palOpen) { const u = lastUndo(); if (u) { e.preventDefault(); runUndo(u); } return; }
  if (pop && e.key === "Escape") { e.preventDefault(); closePop(); return; }
  if (pop || palOpen) return;
  if (drawerOpen && e.key === "Escape") { e.preventDefault(); closeDrawer(); return; }
  if (!drawerOpen && !typing && e.key === "Escape" && selected.size) { e.preventDefault(); clearSel(); return; }
  if (drawerOpen) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (typing) return;
  const k = e.key.toLowerCase();
  if (fsOpen && k !== "f" && k !== "escape" && k !== " ") return;
  if ((k === "n" || k === "c") && !fsOpen) { e.preventDefault(); focusComposer("task"); return; }
  if (k === "b" && !fsOpen) { e.preventDefault(); focusComposer("block"); return; }
  if (k === "/" && !fsOpen) { e.preventDefault(); openPalette(); return; }
  if (k === "?") { e.preventDefault(); showKeys(); return; }
  if (k === "f") { e.preventDefault(); setFs(!fsOpen); }
  else if (k === "escape" && fsOpen) { e.preventDefault(); setFs(false); }
  else if (k === " " && !/BUTTON|A|SUMMARY/.test(e.target.tagName)) { e.preventDefault(); toggleTimer(); renderFs(new Date()); }
});

// The sound was on when you last closed the board, so bring it back at the first touch.
if (store("deskboard-sound-on")) {
  const resume = () => { document.removeEventListener("pointerdown", resume, true); document.removeEventListener("keydown", resume, true); if (!sound) setSound(soundId); };
  document.addEventListener("pointerdown", resume, true);
  document.addEventListener("keydown", resume, true);
}

/* ---------- Clock ---------- */
let lastMinute = -1;
setInterval(() => {
  const now = new Date();
  tickTimer(now.getTime());
  examTick(now);
  warnTick(now);
  renderTop(now);
  renderFs(now);
  if (now.getMinutes() !== lastMinute) {
    lastMinute = now.getMinutes();
    if (checkNote && checkNote.until < now.getTime()) checkNote = null;
    if (!dragging && !document.querySelector("#app input:focus")) render();
  }
}, 1000);
setInterval(load, 2 * 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
render();
load();
</script>
</body>

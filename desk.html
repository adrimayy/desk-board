<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
/* One site, two layouts. Phones get the desk-display board (index.html); bigger screens
   (laptops, desktops, iPads) get the desktop board (desk.html). Same data, same sign-in.
   Add ?view=board or ?view=desk to the address to pin one on this device; ?view=auto undoes it. */
(function () {
  var pin = "";
  try {
    var q = new URLSearchParams(location.search).get("view");
    if (q) localStorage.setItem("deskboard-layout", q === "auto" ? "" : q);
    pin = localStorage.getItem("deskboard-layout") || "";
  } catch (e) {}
  var phone = Math.min(screen.width, screen.height) < 600;
  var want = pin === "board" || pin === "desk" ? pin : (phone ? "board" : "desk");
  var here = /desk\.html$/i.test(location.pathname) ? "desk" : "board";
  if (want !== here) location.replace((want === "desk" ? "desk.html" : "index.html") + location.hash);
})();
</script>
<title>Desk Board · Desktop</title>
<link rel="icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jersey+10&family=Silkscreen&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --page: #efebe1;
  --page-2: #e6e1d4;
  --card: #fbf9f4;
  --card-2: #f4f1e8;
  --line: #ddd7c8;
  --ink: #15301b;
  --ink-2: #4a5d4c;
  --ink-3: #7d8a7c;
  --sage: #86a98c;
  --sage-deep: #5f8a67;
  --mint: #cfe6c8;
  --lcd: #bfdcb8;
  --alert: #b4532a;
  --alert-bg: #f6e1d6;
  --warn: #a8761c;
  --warn-bg: #f4ead2;
  --ok: #3f7d4c;
  --shadow: 0 1px 0 rgba(21, 48, 27, 0.04), 0 6px 18px rgba(21, 48, 27, 0.06);
  --shadow-lift: 0 2px 0 rgba(21, 48, 27, 0.05), 0 18px 40px rgba(21, 48, 27, 0.16);
  --f-ui: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num: "Jersey 10", ui-monospace, monospace;
  --f-label: "Silkscreen", ui-monospace, monospace;
  --radius: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #111713; --page-2: #161e18; --card: #1a231c; --card-2: #212b23; --line: #2e3a30;
    --ink: #e4eedf; --ink-2: #b4c4b0; --ink-3: #85947f; --sage: #86a98c; --sage-deep: #9cc4a3; --mint: #23352a; --lcd: #2c4433;
    --alert: #f08d62; --alert-bg: #3a2219; --warn: #e2b55a; --warn-bg: #352b16; --ok: #8fd18a;
    --shadow: 0 1px 0 rgba(0, 0, 0, 0.3), 0 6px 18px rgba(0, 0, 0, 0.25); --shadow-lift: 0 18px 40px rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #111713; --page-2: #161e18; --card: #1a231c; --card-2: #212b23; --line: #2e3a30;
  --ink: #e4eedf; --ink-2: #b4c4b0; --ink-3: #85947f; --sage: #86a98c; --sage-deep: #9cc4a3; --mint: #23352a; --lcd: #2c4433;
  --alert: #f08d62; --alert-bg: #3a2219; --warn: #e2b55a; --warn-bg: #352b16; --ok: #8fd18a;
  --shadow: 0 1px 0 rgba(0, 0, 0, 0.3), 0 6px 18px rgba(0, 0, 0, 0.25); --shadow-lift: 0 18px 40px rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--page); color: var(--ink); font: 400 15px/1.45 var(--f-ui); -webkit-font-smoothing: antialiased; min-height: 100vh; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--sage-deep); outline-offset: 2px; }
.label { font: 400 10px/1.2 var(--f-label); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }

/* ---------- Top bar ---------- */
.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 20px; padding: 10px 24px; height: 60px; background: color-mix(in srgb, var(--page) 90%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.brand { width: 232px; flex: none; font: 400 12px/1 var(--f-label); letter-spacing: 0.12em; color: var(--ink-2); white-space: nowrap; display: flex; align-items: center; gap: 10px; }
.brand i { width: 22px; height: 22px; border-radius: 6px; background: var(--lcd); box-shadow: inset 0 0 0 2px var(--sage-deep); }
.today { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
.today .date { font-weight: 600; font-size: 1rem; white-space: nowrap; color: var(--ink-2); }
.today .clock { font: 400 28px/1 var(--f-num); letter-spacing: 0.02em; }
.spacer { flex: 1; }
.timer { display: flex; align-items: center; gap: 10px; padding: 4px 4px 4px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; }
.timer .t { font: 400 24px/1 var(--f-num); min-width: 3.1ch; text-align: right; }
.timer .phase { font: 400 9px/1.2 var(--f-label); letter-spacing: 0.08em; color: var(--ink-3); text-transform: uppercase; }
.timer .pomos { display: flex; gap: 3px; min-height: 7px; }
.timer .pomos { font-size: 0.72rem; color: var(--ink-2); font-weight: 600; white-space: nowrap; }
.timer .mode-btn { border: 0; background: transparent; color: var(--ink-3); font-size: 0.72rem; font-weight: 600; padding: 4px 6px; border-radius: 8px; white-space: nowrap; }
.timer .mode-btn:hover:not(:disabled) { background: var(--page-2); color: var(--ink); }
.timer .mode-btn:disabled { opacity: 0.5; }
.pill-btn { border: 0; border-radius: 999px; padding: 7px 14px; font-weight: 600; font-size: 0.85rem; background: var(--card-2); color: var(--ink); }
.pill-btn.primary { background: var(--ink); color: var(--card); }
.pill-btn.sage { background: var(--sage); color: #10261a; }
.pill-btn.ghost { background: transparent; border: 1px solid var(--line); }
.pill-btn:hover { filter: brightness(0.96); }
.sync { display: flex; align-items: center; gap: 7px; font-size: 0.8rem; color: var(--ink-3); white-space: nowrap; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); }
.sync.ok i { background: #7cc47a; box-shadow: 0 0 6px rgba(124, 196, 122, 0.8); }
.sync.bad i { background: var(--alert); }

/* ---------- Editor drawer ---------- */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(10, 20, 12, 0.28); }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; z-index: 41; width: min(460px, 100vw); background: var(--card); border-left: 1px solid var(--line); box-shadow: var(--shadow-lift); display: flex; flex-direction: column; }
.dr-head { display: flex; align-items: center; gap: 10px; padding: 16px 18px 12px; border-bottom: 1px solid var(--line); }
.dr-head h2 { margin: 0; font-size: 1.05rem; flex: 1; }
.dr-x { border: 0; background: transparent; width: 34px; height: 34px; border-radius: 50%; font-size: 20px; color: var(--ink-2); }
.dr-x:hover { background: var(--page-2); }
.dr-body { flex: 1; overflow-y: auto; padding: 14px 18px 20px; display: flex; flex-direction: column; gap: 16px; }
.dr-foot { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 18px 16px; border-top: 1px solid var(--line); }
.dr-foot .grow { flex: 1; }
.fld { display: flex; flex-direction: column; gap: 6px; }
.fld > .label { font-size: 10px; }
.inp { width: 100%; font: inherit; color: var(--ink); background: var(--card-2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; }
.inp:focus { outline: 2px solid var(--sage-deep); outline-offset: 0; background: var(--card); }
.inp.big { font-size: 1.1rem; font-weight: 600; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row .inp { width: auto; flex: 1; min-width: 0; }
.mini { border: 1px solid var(--line); background: var(--card); color: var(--ink-2); border-radius: 999px; padding: 4px 10px; font-size: 0.8rem; font-weight: 600; }
.mini:hover { border-color: var(--sage-deep); color: var(--ink); }
.mini[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--card); }
.mini.danger { color: var(--alert); }
.mini.danger.arm { background: var(--alert); border-color: var(--alert); color: #fff; }
.hint { font-size: 0.8rem; color: var(--ink-3); margin: 0; }
.hint.err { color: var(--alert); font-weight: 600; }
.ed-steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.ed-steps li { display: flex; align-items: center; gap: 4px; }
.ed-steps input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--sage-deep); flex: none; margin-right: 4px; }
.ed-steps .inp { padding: 7px 9px; }
.ed-steps li.digest .inp { border-style: dashed; }
.ico-btn { border: 0; background: transparent; color: var(--ink-3); width: 28px; height: 28px; border-radius: 8px; flex: none; font-size: 15px; padding: 0; }
.ico-btn:hover:not(:disabled) { background: var(--page-2); color: var(--ink); }
.ico-btn:disabled { opacity: 0.3; }
.ico-btn[aria-pressed="true"] { color: var(--sage-deep); font-weight: 700; }
.ro { display: flex; flex-direction: column; gap: 4px; font-size: 0.92rem; }
.ro b { font-size: 1.15rem; }
a.gcal { color: var(--sage-deep); font-weight: 700; font-size: 0.85rem; text-decoration: none; }
a.gcal:hover { text-decoration: underline; }
.edit-link { border: 0; background: none; padding: 0; color: var(--sage-deep); font-weight: 700; font-size: 0.8rem; cursor: pointer; margin-left: 4px; }
.edit-link:hover { text-decoration: underline; }
.now h1 .edit-link { vertical-align: middle; }
.agenda li { cursor: pointer; border-radius: 8px; }
.agenda li:hover { background: var(--card-2); }
.today-card .day-nav { display: flex; align-items: center; gap: 4px; }
.today-card .day-nav h2 { flex: 1; }
.composer { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 20px; border-bottom: 1px solid var(--line); }
.composer .plus { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--sage-deep); color: var(--sage-deep); display: grid; place-items: center; font-weight: 700; line-height: 1; flex: none; margin-right: 4px; }
.composer .inp { flex: 1 1 220px; background: transparent; border-color: transparent; padding: 6px 8px; }
.composer .inp:hover { border-color: var(--line); }
.composer input[type=date], .composer .inp.time { flex: 0 0 auto; width: auto; border-color: var(--line); }
.inp.time { width: 5.2em !important; flex: 0 0 auto !important; text-align: center; font-variant-numeric: tabular-nums; }
.inp.bad { outline: 2px solid var(--alert); }
.composer:not(.open) .more { display: none; }

/* ---------- Full-screen focus (styles) ---------- */
.fs { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; justify-content: space-between; gap: 16px; padding: 28px 40px 32px; background: var(--page); }
.fs-top { display: flex; justify-content: space-between; }
.fs-top .label { font-size: 12px; }
.fs-time { flex: 1; min-height: 0; border: 0; background: none; color: var(--ink); font: 400 min(34vw, 58vh)/0.8 var(--f-num); letter-spacing: 0.02em; display: grid; place-items: center; cursor: pointer; padding: 0; }
.fs.is-rest .fs-time { color: var(--sage-deep); }
.fs-what { text-align: center; max-width: 900px; margin: 0 auto; min-width: 0; width: 100%; }
.fs-title { font-size: clamp(22px, 3.4vw, 36px); font-weight: 700; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fs-step { margin-top: 6px; font-size: clamp(16px, 2vw, 22px); color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fs-title:empty, .fs-step:empty { display: none; }
.fs-bar { display: flex; align-items: center; gap: 12px; max-width: 900px; width: 100%; margin: 0 auto; }
.fs-big { padding: 12px 22px; font-size: 1rem; }
.fs-tally { flex: 1; text-align: center; color: var(--ink-3); font-size: 0.95rem; }
.timer .t { cursor: pointer; }
.timer .expand { border: 0; background: transparent; color: var(--ink-3); width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; padding: 0; }
.timer .expand:hover { background: var(--page-2); color: var(--ink); }
@media (max-width: 640px) { .fs { padding: 18px 16px 20px; } .fs-bar { flex-wrap: wrap; justify-content: center; } .fs-tally { flex-basis: 100%; order: -1; } }

/* ---------- Page: sidebar · list · today ---------- */
.shell { display: grid; grid-template-columns: 256px minmax(0, 1fr) 340px; grid-template-areas: "side main rail"; gap: 28px; max-width: 1640px; margin: 0 auto; padding: 22px 24px 60px; align-items: start; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.ico { width: 18px; height: 18px; flex: none; display: inline-block; }
.ico svg { width: 100%; height: 100%; display: block; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* Sidebar */
.side { grid-area: side; position: sticky; top: 82px; display: flex; flex-direction: column; gap: 2px; max-height: calc(100vh - 100px); overflow-y: auto; }
.nav-item, .course-item { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; background: transparent; text-align: left; padding: 9px 14px; border-radius: 0 999px 999px 0; margin-left: -24px; padding-left: 38px; width: calc(100% + 24px); color: var(--ink-2); font-weight: 600; font-size: 0.93rem; }
.nav-item:hover, .course-item:hover { background: var(--page-2); }
.nav-item[aria-current="true"], .course-item[aria-current="true"] { background: var(--mint); color: var(--ink); }
.nav-item .n, .course-item .n { margin-left: auto; font: 400 17px/1 var(--f-num); color: var(--ink-3); }
.nav-item[aria-current="true"] .n { color: var(--ink); }
.side-label { margin: 18px 0 6px 14px; }
.course-item { font-weight: 500; padding-top: 7px; padding-bottom: 7px; }
.course-item .dot { width: 12px; height: 12px; border-radius: 4px; background: var(--course); flex: none; }
.course-item .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side-foot { margin: 22px 0 0 14px; font-size: 0.78rem; color: var(--ink-3); line-height: 1.9; }
.kbd { font: 600 0.72rem/1 var(--f-ui); padding: 2px 6px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; background: var(--card); color: var(--ink-2); }

/* List header */
.list-wrap { grid-area: main; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
.list-head { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; padding: 4px 4px 0; }
.list-head h1 { margin: 0; font-size: 1.7rem; line-height: 1.1; font-weight: 700; letter-spacing: -0.01em; }
.list-head p { margin: 4px 0 0; color: var(--ink-3); font-size: 0.9rem; }
.list-head .grow { flex: 1; min-width: 200px; }
.list-head.course { padding: 22px 24px 18px; border-radius: var(--radius); background: var(--course); color: #fff; position: relative; overflow: hidden; }
.list-head.course::after { content: ""; position: absolute; right: -40px; top: -60px; width: 200px; height: 200px; border-radius: 50%; background: rgba(255, 255, 255, 0.12); box-shadow: -70px 80px 0 rgba(255, 255, 255, 0.06); }
.list-head.course p { color: rgba(255, 255, 255, 0.88); }
.list-head.course .pill-btn { position: relative; z-index: 1; background: rgba(255, 255, 255, 0.2); color: #fff; }

/* Task list (Google Tasks style) */
.list { padding: 6px 0; }
.group + .group { border-top: 1px solid var(--line); }
.group-head { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: transparent; padding: 14px 20px 6px; text-align: left; }
.group-head h2 { margin: 0; font-size: 0.95rem; font-weight: 700; }
.group-head .n { font: 400 17px/1 var(--f-num); color: var(--ink-3); }
.group-head .chev { margin-left: auto; color: var(--ink-3); transition: transform 0.15s; }
.group.closed .chev { transform: rotate(-90deg); }
.group.closed .tasks { display: none; }
.group.over { background: color-mix(in srgb, var(--mint) 55%, transparent); }
.tasks { list-style: none; margin: 0; padding: 0 0 8px; }
.tasks .none { padding: 6px 20px 10px 62px; font-size: 0.86rem; color: var(--ink-3); }
.drop-hint { height: 3px; margin: 0 20px 0 58px; border-radius: 3px; background: var(--sage-deep); }

.task { position: relative; }
.task-row { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto 32px; align-items: center; gap: 4px 14px; padding: 9px 12px 9px 20px; cursor: pointer; border-radius: 0; }
.task-row:hover { background: var(--card-2); }
.task.dragging { opacity: 0.35; }
.task:focus-visible { outline: none; }
.task:focus-visible .task-row { box-shadow: inset 3px 0 0 var(--sage-deep); background: var(--card-2); }
.check { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--ink-3); background: transparent; padding: 0; display: grid; place-items: center; }
.check:hover { border-color: var(--sage-deep); }
.check:hover::after, .task.is-done .check::after { content: ""; width: 9px; height: 5px; border-left: 2px solid var(--sage-deep); border-bottom: 2px solid var(--sage-deep); transform: rotate(-45deg) translate(1px, -1px); }
.task.is-done .check { background: var(--sage-deep); border-color: var(--sage-deep); }
.task.is-done .check::after { border-color: var(--card); }
.task-main { min-width: 0; }
.task-title { font-size: 1rem; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
.task.is-done .task-title { text-decoration: line-through; color: var(--ink-3); font-weight: 500; }
.task-sub { display: flex; align-items: center; flex-wrap: wrap; gap: 2px 12px; margin-top: 3px; font-size: 0.8rem; color: var(--ink-3); }
.task-sub .crs { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; color: var(--ink-2); }
.task-sub .crs::before { content: ""; width: 8px; height: 8px; border-radius: 3px; background: var(--course); }
.task-sub .warn { color: var(--alert); font-weight: 600; }
.task-sub .ok { color: var(--ok); font-weight: 600; }
.due-pill { justify-self: end; font-size: 0.8rem; font-weight: 600; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; }
.due-pill.alert { background: var(--alert-bg); border-color: transparent; color: var(--alert); }
.due-pill.passed { border-style: dashed; color: var(--ink-3); }
.task.is-passed .task-title { color: var(--ink-2); }
.warn-line { padding: 10px 14px; border-radius: 12px; background: var(--alert-bg); color: var(--alert); font-size: 0.9rem; font-weight: 600; }
.group-head .peek { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.82rem; color: var(--ink-3); font-weight: 500; }
.due-pill.warn { background: var(--warn-bg); border-color: transparent; color: var(--warn); }
.task.is-done .due-pill { opacity: 0.6; }
.star { width: 32px; height: 32px; border-radius: 50%; border: 0; background: transparent; color: var(--ink-3); display: grid; place-items: center; padding: 0; opacity: 0; }
.task-row:hover .star, .task:focus-within .star, .star.on { opacity: 1; }
.star:hover { background: var(--page-2); color: var(--ink); }
.star.on { color: var(--warn); }
.star.on svg { fill: currentColor; }

.task-detail { margin: 0 20px 10px 60px; padding: 14px 16px; border-radius: 12px; background: var(--card-2); display: flex; flex-direction: column; gap: 10px; border-left: 4px solid var(--course); }
.task-detail .line { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; font-size: 0.88rem; color: var(--ink-2); }
.task-detail .line b { color: var(--ink); font-weight: 600; }
.task-detail .find { display: inline-flex; gap: 6px; }
.task-detail .find button, .task-detail .act { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 4px 12px; font-size: 0.8rem; font-weight: 600; }
.task-detail .find button:hover, .task-detail .act:hover { border-color: var(--sage-deep); }
.task-detail .note { font-size: 0.82rem; color: var(--ok); font-weight: 600; }
.task-detail .note.err { color: var(--alert); }
.mini-steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.mini-steps .step { padding: 6px 10px; font-size: 0.88rem; background: var(--card); }
.mini-steps .step .box { width: 16px; height: 16px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; font-size: 0.78rem; font-weight: 600; background: var(--card-2); color: var(--ink-2); white-space: nowrap; }
.chip.course { color: #fff; background: var(--course, var(--sage-deep)); }
.chip.alert { background: var(--alert-bg); color: var(--alert); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.ok { background: var(--mint); color: var(--ok); }
.mode-k { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 4px; background: var(--ink); color: var(--card); font: 400 10px/1 var(--f-label); }

/* Steps (shared) */

.night-list li { display: flex; align-items: center; gap: 8px; }

/* ---------- Classes (Google Classroom style) ---------- */

<body>
<div id="app"></div>
<!-- Editor: opens from any block, the day list, a deadline, or "+ Block". -->
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dr-h" hidden></aside>
<!-- Full-screen focus: click the timer (or press F) to open; Esc, F, Exit or clicking the time closes it. -->
<div class="fs" id="fs" role="dialog" aria-label="Focus mode" hidden>
  <div class="fs-top"><span class="label" id="fs-phase">Focus</span><span class="label" id="fs-clock"></span></div>
  <button class="fs-time" id="fs-time" type="button" title="Leave full screen">25:00</button>
  <div class="fs-what"><div class="fs-title" id="fs-title"></div><div class="fs-step" id="fs-step"></div></div>
  <div class="fs-bar">
    <button class="pill-btn primary fs-big" id="fs-toggle" type="button">Start</button>
    <button class="pill-btn fs-big" id="fs-reset" type="button">Done</button>
    <button class="pill-btn ghost fs-big" id="fs-discard" type="button" hidden>Discard</button>
    <span class="fs-tally" id="fs-tally"></span>
    <button class="pill-btn ghost fs-big" id="fs-mode" type="button">25-min rounds</button>
    <button class="pill-btn ghost fs-big" id="fs-exit" type="button">Exit <span class="kbd">Esc</span></button>
  </div>
</div>

<script src="rules.js"></script>
<script src="shorten.js"></script>
<script>

/* ================= Desktop board ================= */

// Steps with their state, for ticking: { text (as written), show, digest, done }.
function stepsFrom(text) {
  const out = [];
  text.split(/\n/).forEach((line) => {
    const m = /^\s*(?:[-•*·]|\d+[.)])\s+(?:\[([ xX]?)\]\s*)?(.+)/.exec(line) || /^\s*()\[([ xX]?)\]\s+(.+)/.exec(line);
    if (!m) return;
    const box = m.length > 3 ? m[2] : m[1], txt = (m.length > 3 ? m[3] : m[2]).trim();
    if (!txt) return;
    const dg = /^digest\s*:\s*/i.exec(txt);
    out.push({ text: txt, show: dg ? txt.slice(dg[0].length) : txt, digest: !!dg, done: /x/i.test(box || "") });
  });
  return out.slice(0, 12);
}
function parseEvents(list) {
  return (Array.isArray(list) ? list : []).map((e) => {
    const allDay = !!e.allDay;
    let start, end;
    if (allDay) { start = localDate(e.startDate); end = e.endDate ? localDate(e.endDate) : start + DAY; }
    else { start = Number(e.start); end = Number(e.end); }
    const text = plainText(e.desc);
    const ci = /^\s*Check-in:\s*(Done|Partly|Missed)/im.exec(text);
    return {
      id: String(e.id || ""), src: String(e.cal || "primary"), title: String(e.title || "Busy"), where: String(e.where || ""),
      allDay, start, end, checkin: ci ? ci[1].toLowerCase() : null, moved: /^\s*Moved to:/im.test(text),
      rec: !!e.rec, url: String(e.url || ""),
      worked: ((w) => w ? Number(w[1] || 0) * 60 + Number(w[2] || 0) : 0)(/^\s*Worked:\s*(?:(\d+)h)?\s*(?:(\d+)m)?/im.exec(text)),
      steps: e.cal === "canvas" ? [] : stepsFrom(text), modes: e.cal === "canvas" ? [] : modesFrom(text)
    };
  }).filter((e) => !isNaN(e.start) && !isNaN(e.end));
}

const $ = (sel, root) => (root || document).querySelector(sel);
const h = (tag, attrs, ...kids) => {
  const el = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "style") el.setAttribute("style", v);
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "text") el.textContent = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  kids.flat().forEach((c) => { if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(String(c))); });
  return el;
};
function store(key, val) {
  try { if (val === undefined) return JSON.parse(localStorage.getItem(key) || "null"); localStorage.setItem(key, JSON.stringify(val)); }
  catch (e) { return null; }
}

/* ---------- Courses: names and colors ---------- */
// Every course in the four-year plan, most specific first. Which ones are "current" comes
// from the Classes calendar, so the board switches over by itself each semester.
const COURSE_LIST = [
  ["AP", "Advanced Programming", "#4f739c", /advanced programming|coms\s*w?3157|\bap\b/i],
  ["Lit Hum", "Literature Humanities", "#a5643b", /lit\s*hum|literature hum|huma\s*(cc)?\s*100[12]|odyssey|iliad|aeneid|symposium/i],
  ["UW", "University Writing", "#7d5fa0", /\buw\b|university writing|engl\s*(cc)?\s*1010/i],
  ["Econ", "Economics", "#3f8461", /\becon|economics|\bwr\s*\d/i],
  ["Chinese", "Chinese", "#b0444a", /chinese|\bchn\b|chns|pinyin|小班|中文/i],
  ["Phys Lab", "Physics Lab", "#b88a2e", /phys(ics)?\s*lab|experimental phys|1494|ac circuits|polarization|interference/i],
  ["Physics II", "Physics II: E&M", "#c27a2c", /physics\s*(ii|2)\b|phys\w*\s*140[25]|e\s*&\s*m\b|magnetism/i],
  ["Gen Chem", "General Chemistry", "#2f7f86", /gen(eral)?\.?\s*chem|chemistry|\bchem\b|chem\w*\s*140[35]/i],
  ["Computing", "Intro to Computing (Python)", "#5a6fb0", /intro(duction)?\s*to\s*comp|computing|engi\s*e?1006|python/i],
  ["Discrete", "Discrete Math", "#6b5ea8", /discrete/i],
  ["Lin Alg", "Linear Algebra", "#3d7d9a", /linear algebra|lin\.?\s*alg|apma\s*e?3101/i],
  ["Comp Systems", "Fundamentals of Computer Systems", "#557a8f", /fundamentals of computer|computer systems|csee\s*w?3827/i],
  ["EMP", "Earth, Moon & Planets", "#4c8a7a", /earth,?\s*moon/i],
  ["Music Hum", "Music Humanities", "#a0586e", /music hum/i],
  ["PE", "Physical Education", "#7a8a3a", /\bpe\b|physical education|phed/i],
  ["Probability", "Probability", "#6a7f3c", /probability|ieor/i],
  ["3D UI", "3D UI & AR", "#8a5a9a", /3d\s*ui|augmented reality|4172/i],
  ["UI Design", "User Interface Design", "#c06a4a", /ui design|user interface|4170/i],
  ["Databases", "Databases", "#4a7aa0", /databases?|coms\s*w?4111/i],
  ["Startups", "Innovation & Entrepreneurship", "#b5713a", /entrepreneur|innovation/i],
  ["Theory", "CS Theory", "#5f5a9a", /cs theory|computer science theory|3261/i],
  ["Neuro", "Neurobiology Seminar", "#8a5a7a", /neurobiology|\bhart\b/i],
  ["ASE", "Advanced Software Engineering", "#3f6f8f", /software engineering|\base\b|4156/i],
  ["AI", "Artificial Intelligence", "#2f6f6f", /\bai\b|artificial intelligence|4701/i],
  ["Graphics", "Computer Graphics", "#7a5aa0", /graphics|4160/i],
  ["Psych", "Science of Psychology", "#9a5a5a", /psychology|psyc\w*\s*1001/i],
  ["Stars", "Stars and Atoms", "#6a6aa0", /stars and atoms|1836/i],
  ["NLP", "Natural Language Processing", "#3a7a5a", /\bnlp\b|natural language/i],
  ["Exoplanets", "Exoplanets & Astrobiology", "#4a6a9a", /exoplanet|astrobio/i],
  ["Stress", "Stress and the Brain", "#9a6a4a", /stress and the brain|4493/i]
];
const COURSES = {};
COURSE_LIST.forEach(([k, name, color, rx]) => { COURSES[k] = { name, color, rx }; });
// Words that could mean more than one course ("Phys report") go to whichever one you're taking now.
const AMBIGUOUS = [[/\bphys(ics)?\b/i, ["Phys Lab", "Physics II"]], [/\bchem\b/i, ["Gen Chem"]], [/\bcs\b|\bcoms\b/i, ["AP", "Discrete", "Theory", "Databases"]]];
const OTHER = { name: "Other", color: "#77806f" };
let activeCourses = [];
function refreshActiveCourses() {
  const seen = {};
  events.forEach((e) => { if (e.src === "classes" && !e.allDay) { const k = matchCourse(e.title); if (k) seen[k] = 1; } });
  activeCourses = COURSE_LIST.map((c) => c[0]).filter((k) => seen[k]);
}
function matchCourse(t) {
  for (const [k, , , rx] of COURSE_LIST) if (rx.test(t)) return k;
  return null;
}
function courseOf(text) {
  const t = String(text || "");
  const direct = matchCourse(t);
  if (direct) return direct;
  for (const [rx, keys] of AMBIGUOUS) if (rx.test(t)) return keys.find((k) => activeCourses.includes(k)) || keys[0];
  return null;
}
const colorOf = (k) => (k && COURSES[k] ? COURSES[k].color : OTHER.color);
const nameOf = (k) => (k && COURSES[k] ? COURSES[k].name : OTHER.name);

/* ---------- Connection ---------- */
function readConfig() {
  let c = null;
  try {
    const hp = new URLSearchParams(location.hash.slice(1));
    if (hp.get("u") && hp.get("k")) { c = { url: hp.get("u"), key: hp.get("k") }; store("deskboard", c); history.replaceState(null, "", location.pathname); }
  } catch (e) {}
  if (!c) c = store("deskboard");
  return c && c.url && c.key ? c : null;
}
let cfg = readConfig();
function timedFetch(url, opts) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 25000);
  return fetch(url, Object.assign({ signal: ctrl.signal, redirect: "follow" }, opts)).finally(() => clearTimeout(timer));
}
function readJson(r) {
  return r.text().then((t) => {
    try { return JSON.parse(t); } catch (e) { throw { error: "not_json" }; }
  });
}
function apiGet(action, c) {
  c = c || cfg;
  const sep = c.url.indexOf("?") < 0 ? "?" : "&";
  return timedFetch(c.url + sep + "action=" + action + "&key=" + encodeURIComponent(c.key), { cache: "no-store" }).then(readJson);
}
function apiPost(body) {
  body.key = cfg.key;
  return timedFetch(cfg.url, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) })
    .then(readJson).then((d) => { if (!d || !d.ok) throw d || {}; return d; });
}

/* ---------- State ---------- */
let events = [], stats = [], conn = { ok: false, at: 0, error: "" }, sources = {}, calIds = {}, owner = "";
let doneDue = {}, layout = {}, holdLayoutUntil = 0, srv = {};   // srv: reviewed day, last tap anywhere, last fresh start
const localChecks = {}, localSteps = {};
let view = store("deskboard-view") || "todo";
let moveOffer = null, checkNote = null, cardNotes = {}, nightNote = null;
let dragging = null;

const cache = store("deskboard-cache");
if (cache && cache.events && Date.now() - cache.at < 36 * 3600000) {
  events = parseEvents(cache.events);
  stats = cache.stats || [];
  sources = cache.sources || {};
  calIds = cache.calendars || {}; owner = cache.owner || "";
  conn = { ok: true, at: cache.at, stale: true };
  if (cache.state) { doneDue = cache.state.doneDue || {}; layout = cache.state.layout || {}; ["reviewed", "lastActive", "resetAt"].forEach((k) => { if (k in cache.state) srv[k] = cache.state[k]; }); }
}

function applyState(s) {
  if (!s) return;
  if (s.doneDue) doneDue = s.doneDue;
  ["reviewed", "lastActive", "resetAt"].forEach((k) => { if (k in s) srv[k] = s[k]; });
  if (s.layout && Date.now() > holdLayoutUntil) layout = s.layout;
  if (s.log) log = s.log;
  if (s.worked) worked = s.worked;
  if (s.timer && Date.now() > holdTimerUntil) pomo = timerClean(s.timer);
}

let loading = false;
function load() {
  if (!cfg || loading) return;
  loading = true;
  apiGet("data").then((d) => {
    if (!d || !d.ok) throw d || {};
    events = parseEvents(d.events);
    stats = Array.isArray(d.stats) ? d.stats : stats;
    applyState(d.state);
    conn = { ok: true, at: Date.now(), stale: false };
    sources = d.sources || {};
    calIds = d.calendars || calIds; owner = d.owner || owner;
    store("deskboard-cache", { at: Date.now(), events: d.events, state: d.state, stats: d.stats, sources: d.sources, calendars: calIds, owner });
  }).catch((err) => {
    conn = Object.assign({}, conn, { stale: conn.ok, error: err && err.error === "unauthorized" ? "Wrong board key" : "Can't reach your calendar script" });
    if (!conn.ok) conn.ok = false;
  }).finally(() => { loading = false; render(); });
}

/* ---------- Deadlines with everything a card needs ---------- */
const stepKey = (ev, s) => ev.src + "|" + ev.id + "|" + ev.start + "|" + s.text;
const stepDone = (ev, s) => { const k = stepKey(ev, s); return k in localSteps ? localSteps[k] : s.done; };
const rating = (ev) => localChecks[ev.src + "|" + ev.id + "|" + ev.start] || ev.checkin;

function deadlines(now) {

    const del = h("button", { class: "mini danger", type: "button", text: "Delete" });
    del.addEventListener("click", () => {
      if (!del.classList.contains("arm")) { del.classList.add("arm"); del.textContent = "Click again to delete"; return; }
      const copy = { action: "saveDue", title: x.title, day: x.d.day, time: x.d.dueAt ? fmtTime(x.d.dueAt) : "" };
      apiPost({ action: "deleteDue", ref: { cal: ref.cal, id: ref.id, start: ref.start } }).then(() => {
        closeDrawer(); undoOffer = { text: "Deleted “" + x.title + "”.", label: "Undo", run: () => apiPost(copy).then(load) }; load();
      }).catch(fail("delete"));
    });
    foot.push(del);
  }
  const first = refsOf(x)[0];
  if (canvasEv && canvasEv.url) foot.push(h("a", { class: "gcal", href: canvasEv.url, target: "_blank", rel: "noopener", text: "Canvas ↗" }));
  else if (first && first.cal !== "canvas") foot.push(h("a", { class: "gcal", href: gcalLink({ src: first.cal, id: first.id, start: first.start, rec: first.rec }), target: "_blank", rel: "noopener", text: "Calendar ↗" }));
  openDrawer(ref ? "Edit deadline" : "Deadline", body, foot);
  if (ref) name.addEventListener("keydown", (e) => { if (e.key === "Enter") save(); });
}

/* ---------- Full-screen focus ---------- */
// Click the timer or press F to fill the screen with it (and go browser full screen where allowed).
// Esc, F, Exit or clicking the time brings the board back. Stays open across reloads until you leave it.
let fsOpen = false;
function setFs(on) {
  if (on === fsOpen) return;
  fsOpen = on;
  $("#fs").hidden = !on;
  store("deskboard-fs", on);
  if (on) {
    if (!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    try { if (document.documentElement.requestFullscreen && !document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {}); } catch (e) {}
    renderFs(new Date());
    $("#fs-toggle").focus({ preventScroll: true });
  } else {
    try { if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {}); } catch (e) {}
  }
}
function renderFs(now) {
  if (!fsOpen) return;
  const t = now.getTime();
  $("#fs-time").textContent = timerText(pomo, t);
  $("#fs").classList.toggle("is-rest", pomo.mode === "pomo" && pomo.phase === "rest");
  $("#fs-phase").textContent = timerLabel(pomo, t);
  $("#fs-clock").textContent = fmtTime(t);
  $("#fs-toggle").textContent = timerButton(pomo);
  $("#fs-reset").textContent = pomo.mode === "flow" ? "Done" : "Reset";
  $("#fs-discard").hidden = !(pomo.mode === "flow" && flowElapsed(pomo, t) > 0);
  $("#fs-mode").textContent = pomo.mode === "flow" ? "25-min rounds" : "Count up";
  $("#fs-mode").disabled = timerRunning(pomo);
  const blk = studyBlockAt(t);
  let title = "", step = "";
  if (blk) {
    title = blk.title;
    const open = blk.steps.filter((x) => !stepDone(blk, x));
    step = blk.steps.length ? (open.length ? "Next: " + open[0].show + (blk.steps.length > 1 ? "  ·  " + (blk.steps.length - open.length) + "/" + blk.steps.length + " done" : "") : "All steps done")
      : /\b(eat|break|lunch|dinner|breakfast|commute|sleep)\b/i.test(blk.title) ? "" : "Open it and do one 25-min round.";
    if (pomo.mode === "pomo" && pomo.phase === "rest" && blk.modes && blk.modes.length) step = "Digest first: " + blk.modes.slice(0, 2).map((k) => PACER[k].verb).join(" · ");
  }
  if ($("#fs-title").textContent !== title) $("#fs-title").textContent = title;
  if ($("#fs-step").textContent !== step) $("#fs-step").textContent = step;
  $("#fs-tally").textContent = fmtMins(workedToday(now)) + " worked today";
}
$("#fs-time").addEventListener("click", () => setFs(false));
$("#fs-exit").addEventListener("click", () => setFs(false));
$("#fs-toggle").addEventListener("click", () => { toggleTimer(); renderFs(new Date()); });
$("#fs-reset").addEventListener("click", () => { resetTimer(); renderFs(new Date()); });
$("#fs-discard").addEventListener("click", discardTimer);
$("#fs-mode").addEventListener("click", switchMode);
// Esc in browser full screen leaves full screen first; take the overlay down with it.
document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement && fsOpen) setFs(false); });
document.addEventListener("keydown", (e) => {
  if (drawerOpen && e.key === "Escape") { e.preventDefault(); closeDrawer(); return; }
  if (drawerOpen) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  const k = e.key.toLowerCase();
  if (k === "f") { e.preventDefault(); setFs(!fsOpen); }
  else if (k === "escape" && fsOpen) { e.preventDefault(); setFs(false); }
  else if (k === " " && fsOpen && (e.target === document.body || e.target === $("#fs"))) { e.preventDefault(); toggleTimer(); renderFs(new Date()); }
});

/* ---------- Clock ---------- */
let lastMinute = -1;
setInterval(() => {
  const now = new Date();
  tickTimer(now.getTime());
  renderTop(now);
  renderFs(now);
  if (now.getMinutes() !== lastMinute) {
    lastMinute = now.getMinutes();
    if (checkNote && checkNote.until < now.getTime()) checkNote = null;
    if (!dragging && !document.querySelector("#app input:focus")) render();
  }
}, 1000);
setInterval(load, 2 * 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
render();
if (store("deskboard-fs") === true && cfg) setFs(true);
load();
</script>
</body>
